<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>Canopy</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1033"/>
      <stop offset="1" stop-color="#0B1220"/>
    </linearGradient>
    <radialGradient id="bloom" cx="0.5" cy="0.36" r="0.6">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="72" y1="212" x2="188" y2="48">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.55" stop-color="#6E8BF3"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="graph" fill="none" stroke="url(#ink)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M128 206 V62"/>
      <path d="M128 182 C128 152 78 156 78 126 C78 92 128 96 128 62"/>
      <path d="M128 150 C128 128 180 134 180 104 C180 80 128 88 128 62"/>
    </g>
    <g id="nodes" fill="url(#ink)">
      <circle cx="128" cy="206" r="15"/>
      <circle cx="78" cy="126" r="15"/>
      <circle cx="180" cy="104" r="15"/>
      <circle cx="128" cy="124" r="15"/>
      <circle cx="128" cy="60" r="18"/>
    </g>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bloom)"/>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="url(#rim)" stroke-width="2"/>

  <g opacity="0.55" filter="url(#glow)">
    <use href="#graph"/>
    <use href="#nodes"/>
  </g>
  <use href="#graph"/>
  <use href="#nodes"/>

  <g fill="#0B1220">
    <circle cx="128" cy="206" r="6.5"/>
    <circle cx="78" cy="126" r="6.5"/>
    <circle cx="180" cy="104" r="6.5"/>
    <circle cx="128" cy="124" r="6.5"/>
    <circle cx="128" cy="60" r="8"/>
  </g>
</svg>
