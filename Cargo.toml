[workspace]
resolver = "3"
members = ["crates/canopy-core", "crates/canopy-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["NecturaLabs"]
license = "LicenseRef-NecturaLabs-Proprietary"
repository = "https://github.com/NecturaLabs/Canopy"
publish = false

[workspace.dependencies]
canopy-core = { path = "crates/canopy-core" }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
# Network operations go through the git CLI (credential helpers, SSH config, hooks), so libgit2
# is built without its HTTPS and SSH transports: no OpenSSL or libssh2 on any platform.
git2 = { version = "0.21", default-features = false }
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3

# Keep the UI responsive in debug builds: optimise dependencies, not our own crates.
[profile.dev.package."*"]
opt-level = 2
