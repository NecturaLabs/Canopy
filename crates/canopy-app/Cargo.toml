[package]
name = "canopy-app"
description = "Canopy: a fast, beautiful, Linux-first Git client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
canopy-core.workspace = true
canopy-hosting.workspace = true
git2.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
chrono.workspace = true
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36"
# SVG art (placeholders in assets/art/, rendered with resvg).
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
rfd = "0.17"
# Opt-in crash reports (see docs/legal/privacy-policy.md). ureq + rustls transport, as
# canopy-hosting uses; no tracing integration, so logs never leave the computer.
sentry = { version = "0.49", default-features = false, features = ["backtrace", "contexts", "panic", "release-health", "ureq", "rustls"] }
# Diff syntax highlighting on the repository thread. Pure-Rust regex engine (no Oniguruma);
# two-face adds bat's grammars (TypeScript, TOML, Dockerfile, …) to syntect's defaults.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy", "dump-load"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
notify = "8"
png = "0.18"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
