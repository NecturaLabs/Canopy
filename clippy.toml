# Clippy configuration. The lint levels are in the workspace Cargo.toml ([workspace.lints]).

# Nothing outside the workspace uses these crates (publish = false), so lints may suggest changing
# public signatures.
avoid-breaking-exported-api = false

# Tests may unwrap, expect, panic and print: a panic there is a failed assertion. Production code
# may not (workspace lints `unwrap_used`, `expect_used`, `panic`, `print_stdout`, `print_stderr`).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true

# Names doc comments use as prose, not code (`..` keeps clippy's own list).
doc-valid-idents = [
  "..", "AltGr", "GitKraken", "JetBrains", "NecturaLabs", "OpenGL", "TextEdit", "Wayland",
  "libgit2", "egui", "eframe", "egui_glow",
]
# `use super::*` is how a file continues its parent module (app/*.rs extend CanopyApp, the dialogs
# share their module's imports); spelling those lists out would differ between test and normal builds.
allowed-wildcard-imports = ["super"]

# AGENTS.md, "Conventions": every repository mutation and all Git network traffic run the git
# executable through canopy_core::cli. The few other programs Canopy starts (the platform's URL
# opener, file manager and terminal, the updater's installer) carry an `expect` naming them.
[[disallowed-methods]]
path = "std::process::Command::new"
reason = "git runs through canopy_core::cli (AGENTS.md, Conventions); other programs need an expect saying why"

