# Dependabot's pull requests run CI on GitHub-hosted runners only (see ci.yml): a new crate's
# build script is unreviewed code and must not run on the self-hosted machine that builds
# releases.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      egui:
        patterns: ["egui", "eframe", "egui-*", "epaint", "emath", "ecolor"]
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  # Actions are pinned to full commit SHAs with the version in a trailing comment
  # (`uses: owner/repo@<sha> # v1.2.3`); Dependabot updates both.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup-rust"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
