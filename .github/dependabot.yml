# Dependabot's pull requests run CI on GitHub-hosted runners, like every job (see ci.yml).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      egui:
        patterns: ["egui", "eframe", "egui-*", "epaint", "emath", "ecolor"]
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

  # Actions are pinned to full commit SHAs with the version in a trailing comment
  # (`uses: owner/repo@<sha> # v1.2.3`); Dependabot updates both.
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/setup-rust"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
