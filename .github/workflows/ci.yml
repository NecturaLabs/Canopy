name: CI

# Every push to one of this repository's branches runs CI, whether or not it has a pull request,
# so the owner's working branches are tested on their own. A pull request from a branch of this
# repository would only repeat that run, so its jobs are skipped; pull requests from forks and
# from Dependabot run. Dependabot's own branches are left out of `push`: their pull request runs
# them once.
on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Linux and Windows jobs run on the organisation's self-hosted runners; the
# organisation variable USE_SELF_HOSTED set to '0' moves them to GitHub-hosted
# ones. There is no self-hosted macOS runner.
#
# The self-hosted machine also builds releases, so it only runs code that people
# with write access pushed to this repository's branches. Everything else runs on
# GitHub-hosted runners: every pull_request run (a fork, or Dependabot, since
# pull requests from this repository's other branches are skipped), and anything
# Dependabot started or that sits on a dependabot/ branch, whose new crates' build
# scripts are unreviewed code. Keep the same condition in every job's runs-on and
# `if`.

jobs:
  fmt:
    name: Format
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event_name != 'push' || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/')) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event_name != 'push' || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/')) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/')
    permissions:
      contents: read
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event_name != 'push' || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/') || !matrix.self-hosted) && matrix.hosted || fromJSON(matrix.self-hosted) }}
    if: (vars.CI_LINUX != '0' || vars.CI_MACOS == '1' || vars.CI_WINDOWS == '1') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/'))
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One toggle per platform, as repository variables: Linux runs unless CI_LINUX is '0';
      # macOS and Windows run only when CI_MACOS or CI_WINDOWS is '1' (both off for now, the
      # owner's call). Their installer checks come back with them.
      matrix:
        include: ${{ fromJSON(format('[{0}{1}{2}]', vars.CI_LINUX != '0' && '{"os":"Linux","hosted":"ubuntu-latest","self-hosted":"[\"self-hosted\", \"linux\", \"wsl\"]"}' || '', vars.CI_MACOS == '1' && format('{0}{1}', vars.CI_LINUX != '0' && ',' || '', '{"os":"macOS","hosted":"macos-latest"}') || '', vars.CI_WINDOWS == '1' && format('{0}{1}', (vars.CI_LINUX != '0' || vars.CI_MACOS == '1') && ',' || '', '{"os":"Windows","hosted":"windows-latest","self-hosted":"[\"self-hosted\", \"windows\", \"x64\"]"}') || '')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # A job-local global config: self-hosted runners share one home, whose
      # ~/.gitconfig is the machine's own.
      - name: Configure git for tests
        shell: bash
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global user.name "Canopy CI"
          git config --global user.email "ci@canopy.invalid"
          git config --global init.defaultBranch main
      - run: cargo test --workspace --locked
      # install.sh's macOS flow, natively (the `tooling` job runs the Linux flow, and the macOS
      # one under a fake uname). Fake releases on 127.0.0.1, in a temporary HOME.
      - name: Test the installer on macOS
        if: matrix.os == 'macOS'
        run: packaging/test-install.sh
      # install.ps1 cannot run on Linux: parse it with Windows PowerShell 5.1 (the oldest version
      # it supports) and PowerShell 7, run its argument handling in both, check that `irm | iex`
      # leaves the caller's session clean, and lint it with PSScriptAnalyzer where the runner has
      # it. The Linux installer is tested in `tooling`.
      - name: Check the PowerShell installer
        if: matrix.os == 'Windows'
        shell: pwsh
        run: |
          # Native commands below are expected to fail; their exit codes are checked by hand.
          $ErrorActionPreference = 'Continue'
          $env:CANOPY_PS1 = (Resolve-Path packaging/install.ps1).Path
          # Every run below must stop before it installs anything. Should one not, it installs
          # into this job's temporary folder, with -NoPath, and the checks at the end catch a
          # Start Menu shortcut, Apps & features entry or user PATH change it made (compared with
          # before: a self-hosted runner's user may have Canopy installed).
          $env:CANOPY_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'canopy-install-smoke'
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Canopy.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\io.necturalabs.Canopy'
          $state = { "$(Test-Path -LiteralPath $lnk) $(Test-Path -LiteralPath $key) $([Environment]::GetEnvironmentVariable('Path', 'User'))" }
          $before = & $state
          $parse = '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile($env:CANOPY_PS1, [ref]$null, [ref]$e); if ($e.Count) { $e | Format-List | Out-String | Write-Host; exit 1 }; exit 0'
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($parse))
          # Through iex the script runs in the caller's scope: none of its helpers, variables,
          # StrictMode or preferences may be left there, and it must throw rather than exit.
          $iex = @'
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'Continue'
          $protocols = [Net.ServicePointManager]::SecurityProtocol
          $env:CANOPY_INSTALL_BASE_URL = 'https://example.invalid'
          $threw = $false
          try { Get-Content -LiteralPath $env:CANOPY_PS1 -Raw | Invoke-Expression 6>$null } catch { $threw = $true }
          $problems = @()
          if (-not $threw) { $problems += 'it did not throw' }
          $fns = @(Get-Command -CommandType Function -Name Fail, Say, Get-File, Invoke-Install, Invoke-Uninstall -ErrorAction SilentlyContinue)
          if ($fns.Count) { $problems += "functions left: $($fns.Name -join ', ')" }
          $vars = @(Get-Variable -Name AppId, FeedUrl, ReleasesUrl, UninstallKey, LocalHost, LocalPort, ScriptFile, InstalledEntries, ExtraArgs, Invocation, savedProtocols, failed, root, mode -ErrorAction SilentlyContinue)
          if ($vars.Count) { $problems += "variables left: $($vars.Name -join ', ')" }
          if ($ErrorActionPreference -ne 'Continue') { $problems += "ErrorActionPreference is $ErrorActionPreference" }
          if ($ProgressPreference -ne 'Continue') { $problems += "ProgressPreference is $ProgressPreference" }
          if ([Net.ServicePointManager]::SecurityProtocol -ne $protocols) { $problems += 'SecurityProtocol changed' }
          try { $null = $notDefinedAnywhere } catch { $problems += 'StrictMode left on' }
          if ($problems.Count) { $problems | Write-Host; exit 1 }
          exit 0
          '@
          $iexEncoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($iex))
          $badFeeds = @('https://example.invalid', 'http://127.0.0.1:1@example.invalid', 'http://localhost:1@x', 'http://127.0.0.1:1/x')
          foreach ($ps in @('powershell.exe', 'pwsh')) {
            & $ps -NoProfile -EncodedCommand $encoded
            if ($LASTEXITCODE -ne 0) { throw "${ps} could not parse install.ps1" }
            & $ps -NoProfile -ExecutionPolicy Bypass -File $env:CANOPY_PS1 -Help | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "${ps}: install.ps1 -Help exited with $LASTEXITCODE" }
            & $ps -NoProfile -ExecutionPolicy Bypass -File $env:CANOPY_PS1 -NoSuchOption *>&1 | Out-Null
            if ($LASTEXITCODE -ne 1) { throw "${ps}: install.ps1 accepted an unknown option" }
            foreach ($bad in $badFeeds) {
              $env:CANOPY_INSTALL_BASE_URL = $bad
              & $ps -NoProfile -ExecutionPolicy Bypass -File $env:CANOPY_PS1 -NoPath *>&1 | Out-Null
              $code = $LASTEXITCODE
              Remove-Item Env:CANOPY_INSTALL_BASE_URL
              if ($code -ne 1) { throw "${ps}: install.ps1 accepted the test feed $bad" }
            }
            & $ps -NoProfile -ExecutionPolicy Bypass -EncodedCommand $iexEncoded
            if ($LASTEXITCODE -ne 0) { throw "${ps}: install.ps1 run through iex left state in the session" }
            Write-Host "${ps}: install.ps1 parses, handles its arguments and leaves an iex session clean"
          }
          if (Test-Path -LiteralPath $env:CANOPY_INSTALL_DIR) { throw 'a smoke run created the install folder' }
          if ((& $state) -ne $before) { throw 'a smoke run changed the Start Menu, Apps & features or the user PATH' }
          if (Get-Module -ListAvailable -Name PSScriptAnalyzer) {
            # Write-Host is the installer's intended output; helpers such as Fail are no cmdlets.
            $found = @(Invoke-ScriptAnalyzer -Path $env:CANOPY_PS1 -Severity Warning, Error -ExcludeRule PSAvoidUsingWriteHost, PSUseApprovedVerbs)
            $found | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
            if ($found | Where-Object Severity -eq 'Error') { throw 'PSScriptAnalyzer reported errors in install.ps1' }
          } else {
            Write-Host '::notice::PSScriptAnalyzer is not installed on this runner; install.ps1 was parsed and smoke-tested only.'
          }
          exit 0

  deny:
    name: cargo-deny
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event_name != 'push' || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/')) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # A prebuilt binary: the cargo-deny action is a container action, which on
      # the self-hosted runners would leave root-owned files in their work folders.
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny
      - run: cargo deny check

  tooling:
    name: Release tooling and licence notices
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event_name != 'push' || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/')) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: python3 tools/release.py selftest
      # A pinned, checksum-verified ShellCheck, so every runner reports the same findings.
      # packaging/ is held to every rule; tools/ to warnings and errors.
      - name: ShellCheck
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          dir="$RUNNER_TEMP/shellcheck"
          rm -rf "$dir" && mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
            --output "$dir/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $dir/shellcheck.tar.xz" | sha256sum --check --quiet -
          tar -xJf "$dir/shellcheck.tar.xz" -C "$dir"
          shellcheck="$dir/shellcheck-$SHELLCHECK_VERSION/shellcheck"
          "$shellcheck" --version
          "$shellcheck" packaging/*.sh
          "$shellcheck" --severity=warning tools/*.sh
          rm -rf "$dir"
      # Installs, upgrades, refuses a bad checksum and uninstalls against a fake feed on
      # 127.0.0.1, in a temporary HOME.
      - name: Test the Linux installer
        run: packaging/test-install.sh
      - run: cargo fetch --locked
      # Every release ships docs/legal/third-party-notices.txt; a dependency change must update it.
      - run: python3 tools/notices.py --check
