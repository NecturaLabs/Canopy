# Format, lint, test and licence-check every push and pull request.
#
# Runs on the organisation's self-hosted Linux runners (labels `self-hosted, linux, wsl`).
# Every runner is on one machine, so the jobs start together and each keeps its Cargo `target/`
# in its own runner workspace between runs (`clean: false`): no GitHub cache round trips, and
# incremental builds after the first run. Nothing here touches the runner user's global git
# configuration; tests get an isolated one through GIT_CONFIG_GLOBAL.
#
# The macOS and Windows test jobs run on GitHub-hosted runners and are switched off, not removed.
# Turn them back on without editing this file by setting the repository variable
# `CANOPY_HOSTED_TESTS` to `true` (Settings → Secrets and variables → Actions → Variables), or
# run this workflow by hand with "hosted-tests" ticked.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      hosted-tests:
        description: Also run the macOS and Windows tests on GitHub-hosted runners
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Format
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Check build tools
        run: tools/ci-preflight.sh
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (Linux)
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check build tools
        run: tools/ci-preflight.sh
      - name: Isolated git configuration for tests
        run: tools/ci-gitconfig.sh "$RUNNER_TEMP/gitconfig"
      - run: cargo test --workspace --locked
        env:
          GIT_CONFIG_GLOBAL: ${{ runner.temp }}/gitconfig
          GIT_CONFIG_NOSYSTEM: "1"

  deny:
    name: cargo-deny
    runs-on: [self-hosted, linux, wsl]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          clean: false
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      # A prebuilt binary: the cargo-deny action is a container action, and the self-hosted
      # runners do not run containers.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  # Switched off: GitHub-hosted macOS and Windows runners. See the note at the top.
  test-hosted:
    name: Test (${{ matrix.os }})
    if: vars.CANOPY_HOSTED_TESTS == 'true' || inputs.hosted-tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Configure git for tests
        shell: bash
        run: |
          git config --global user.name "Canopy CI"
          git config --global user.email "ci@canopy.invalid"
          git config --global init.defaultBranch main
      - run: cargo test --workspace --locked
