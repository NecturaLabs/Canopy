name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Linux and Windows jobs run on the organisation's self-hosted runners; the
# organisation variable USE_SELF_HOSTED set to '0' moves them to GitHub-hosted
# ones. There is no self-hosted macOS runner.
#
# Pull requests from forks always run on GitHub-hosted runners: the self-hosted
# machine also builds releases, so it only runs code from this repository's own
# branches.

jobs:
  fmt:
    name: Format
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event.pull_request.head.repo.fork || !matrix.self-hosted) && matrix.hosted || fromJSON(matrix.self-hosted) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: Linux
            hosted: ubuntu-latest
            self-hosted: '["self-hosted", "linux", "wsl"]'
          - os: macOS
            hosted: macos-latest
          - os: Windows
            hosted: windows-latest
            self-hosted: '["self-hosted", "windows", "x64"]'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # A job-local global config: self-hosted runners share one home, whose
      # ~/.gitconfig is the machine's own.
      - name: Configure git for tests
        shell: bash
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global user.name "Canopy CI"
          git config --global user.email "ci@canopy.invalid"
          git config --global init.defaultBranch main
      - run: cargo test --workspace --locked

  deny:
    name: cargo-deny
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # A prebuilt binary: the cargo-deny action is a container action, which on
      # the self-hosted runners would leave root-owned files in their work folders.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  tooling:
    name: Release tooling and licence notices
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event.pull_request.head.repo.fork) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - run: python3 tools/release.py selftest
      - run: cargo fetch --locked
      # Every release ships docs/legal/third-party-notices.txt; a dependency change must update it.
      - run: python3 tools/notices.py --check
