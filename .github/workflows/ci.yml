name: CI

# Every push to one of this repository's branches runs CI, whether or not it has a pull request,
# so the owner's working branches are tested on their own. A pull request from a branch of this
# repository would only repeat that run, so its jobs are skipped; pull requests from forks and
# from Dependabot run. Dependabot's own branches are left out of `push`: their pull request runs
# them once.
on:
  push:
    branches: ["**", "!dependabot/**"]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Line numbers in panics and backtraces without full debug info: a faster build and a
  # smaller target folder.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Linux and Windows jobs run on the organisation's self-hosted runners; the
# organisation variable USE_SELF_HOSTED set to '0' moves them to GitHub-hosted
# ones. There is no self-hosted macOS runner.
#
# The self-hosted machine also builds releases, so it only runs code that people
# with write access pushed to this repository's branches. Everything else runs on
# GitHub-hosted runners: every pull_request run (a fork, or Dependabot, since
# pull requests from this repository's other branches are skipped), and anything
# Dependabot started or that sits on a dependabot/ branch, whose new crates' build
# scripts are unreviewed code. Keep the same condition in every job's runs-on and
# `if`.

jobs:
  # A push or pull request that changes only documentation (docs/ other than docs/legal/, and
  # Markdown other than CHANGELOG.md, both of which the app embeds) or the landing site (site/,
  # which site.yml checks and deploys) runs only the documentation and site checks. The run still
  # exists and passes, which is what a release checks for. When the changed files cannot be listed
  # (no passing run on the branch yet, or one a force-push left behind), everything runs.
  changes:
    name: What changed
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event_name != 'push' || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/')) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/')
    timeout-minutes: 5
    permissions:
      contents: read
      # Listing this workflow's earlier runs.
      actions: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          code=true
          # A push is compared with the last commit CI passed on this branch, not only with the
          # previous push, whose run may have been cancelled before it tested anything. A failed
          # call prints the error body on stdout, which must not be taken for a commit.
          if [[ -z $BASE ]]; then
            encoded=$(jq -rn --arg b "$BRANCH" '$b | @uri')
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=$encoded&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // ""') || BASE=
          fi
          [[ $BASE =~ ^[0-9a-f]{40}$ && ! $BASE =~ ^0+$ ]] || BASE=
          # A pull request is compared with its base branch, which counts only when CI passed on
          # that very commit.
          if [[ $EVENT == pull_request && -n $BASE ]]; then
            passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$BASE&event=push&status=success&per_page=1" \
              --jq '.total_count') || passed=
            [[ $passed =~ ^[1-9][0-9]*$ ]] || BASE=
          fi
          echo "Compared with: ${BASE:-nothing}"
          # The comparison lists what changed since the merge base. A push counts only when the
          # tested commit is an ancestor (status "ahead"): after a force-push the merge base can
          # hold code that was never tested. A rename counts under both names, so code moved into
          # docs/ still runs the Rust jobs.
          if [[ -n $BASE ]] \
            && compared=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" \
              --jq '.status, (.files[] | .filename, (.previous_filename // empty))'); then
            status=$(head -n 1 <<<"$compared")
            files=$(tail -n +2 <<<"$compared")
            count=$(grep -c . <<<"$files" || true)
            echo "Comparison: $status, $count paths"
            # The comparison lists at most 300 files.
            if [[ $EVENT != push || $status == ahead ]] && (( count > 0 && count < 300 )); then
              code=false
              while IFS= read -r f; do
                case $f in
                  docs/legal/* | CHANGELOG.md) code=true ;;
                  docs/* | *.md | site/*) ;;
                  *) code=true ;;
                esac
              done <<<"$files"
            fi
          fi
          echo "Rust jobs run: $code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  clippy:
    name: Clippy
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event_name != 'push' || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/')) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      # `-D warnings` after `--` applies to the workspace members only. RUSTFLAGS would also apply
      # it to vendor/eframe, a path dependency cargo does not cap, so a newer rustc's warnings in
      # code we do not write would fail CI.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event_name != 'push' || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/') || !matrix.self-hosted) && matrix.hosted || fromJSON(matrix.self-hosted) }}
    needs: changes
    if: needs.changes.outputs.code == 'true' && (format('{0}', vars.CI_LINUX) != '0' || vars.CI_MACOS == '1' || vars.CI_WINDOWS == '1') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/'))
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # One toggle per platform, as repository variables: Linux runs unless CI_LINUX is '0';
      # macOS and Windows run only when CI_MACOS or CI_WINDOWS is '1' (both off for now, the
      # owner's call).
      matrix:
        include: ${{ fromJSON(format('[{0}{1}{2}]', format('{0}', vars.CI_LINUX) != '0' && '{"os":"Linux","hosted":"ubuntu-latest","self-hosted":"[\"self-hosted\", \"linux\", \"wsl\"]"}' || '', vars.CI_MACOS == '1' && format('{0}{1}', format('{0}', vars.CI_LINUX) != '0' && ',' || '', '{"os":"macOS","hosted":"macos-latest"}') || '', vars.CI_WINDOWS == '1' && format('{0}{1}', (format('{0}', vars.CI_LINUX) != '0' || vars.CI_MACOS == '1') && ',' || '', '{"os":"Windows","hosted":"windows-latest","self-hosted":"[\"self-hosted\", \"windows\", \"x64\"]"}') || '')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # A job-local global config: self-hosted runners share one home, whose
      # ~/.gitconfig is the machine's own.
      - name: Configure git for tests
        shell: bash
        run: |
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/gitconfig"
          echo "GIT_CONFIG_GLOBAL=$GIT_CONFIG_GLOBAL" >> "$GITHUB_ENV"
          git config --global user.name "Canopy CI"
          git config --global user.email "ci@canopy.invalid"
          git config --global init.defaultBranch main
      # Every test binary runs even after one fails, so a run reports every failure at once.
      - run: cargo test --workspace --locked --no-fail-fast
      # A window the compositor is not drawing must keep answering its pings (ADR 0007). The check
      # runs the app on a stand-in compositor with software OpenGL. A GitHub-hosted runner (pull
      # requests, Dependabot's eframe bumps) gets the tools installed and must pass. A self-hosted
      # runner has whatever its owner installed: the check runs there when it can, and a failure
      # shows in the log without failing the job.
      - name: Install the tools for the hidden-window check
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          pkg-config libwayland-dev wayland-protocols libwayland-bin
          libxkbcommon0 libegl1 libegl-mesa0 libgl1-mesa-dri
      - name: Hidden-window check
        if: runner.os == 'Linux'
        continue-on-error: ${{ runner.environment != 'github-hosted' }}
        env:
          REQUIRE: ${{ runner.environment == 'github-hosted' && '--require' || '' }}
        run: python3 tools/stall-check.py ${REQUIRE:+"$REQUIRE"}

  # The quick checks share one job, so a run starts fewer jobs than there are self-hosted runners
  # and none waits for another to finish. Every check runs even when an earlier one failed, so one
  # run reports them all. A documentation-only change runs only the documentation check.
  checks:
    name: Format, docs, tooling and dependencies
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || github.event_name != 'push' || github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || github.event.pull_request.user.login == 'dependabot[bot]' || startsWith(github.head_ref || github.ref_name, 'dependabot/')) && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    needs: changes
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || startsWith(github.head_ref, 'dependabot/')
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Only the cargo steps need Rust, and a documentation-only change runs none of them.
      - id: rust
        if: needs.changes.outputs.code == 'true'
        uses: ./.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - name: cargo fmt --all --check
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo fmt --all --check
      # The docs map, paths named in docs, the module table and the skill mirror.
      - name: Documentation check
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 tools/check-docs.py
      # Files the landing site names exist, its addresses keep to its content security policy and
      # its scripts parse.
      - name: Site check
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 tools/check-site.py
      - name: Release tooling self-test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && needs.changes.outputs.code == 'true' }}
        run: python3 tools/release.py selftest
      # A pinned, checksum-verified ShellCheck, so every runner reports the same findings.
      # packaging/ is held to every rule; tools/ to warnings and errors. A self-hosted runner keeps
      # the archive in its tool cache and checks it again before every use.
      - name: ShellCheck
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && needs.changes.outputs.code == 'true' }}
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          name="shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          archive="$RUNNER_TOOL_CACHE/shellcheck/$name"
          mkdir -p "${archive%/*}"
          if ! echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check --status - 2>/dev/null; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 \
              --output "$archive" \
              "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/$name"
            echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check --quiet - || { rm -f "$archive"; exit 1; }
          fi
          dir="$RUNNER_TEMP/shellcheck"
          rm -rf "$dir" && mkdir -p "$dir"
          tar -xJf "$archive" -C "$dir"
          shellcheck="$dir/shellcheck-$SHELLCHECK_VERSION/shellcheck"
          "$shellcheck" --version
          "$shellcheck" packaging/*.sh
          "$shellcheck" --severity=warning tools/*.sh
          rm -rf "$dir"
      # install.sh against a fake update feed on 127.0.0.1, in a temporary HOME.
      - name: Installer test
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && needs.changes.outputs.code == 'true' }}
        env:
          TMPDIR: ${{ runner.temp }}
        run: sh packaging/test-install.sh
      - id: fetch
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo fetch --locked
      # vendor/eframe must be the published eframe plus vendor/eframe.patch, and the workspace must
      # build it. Cargo only warns when the [patch] entry stops applying, which an eframe version
      # bump from Dependabot does, and the window would stall on a hidden workspace again (ADR 0007).
      - name: Vendored eframe check
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: tools/vendor-eframe.sh --check
      # Every release ships docs/legal/third-party-notices.txt; a dependency change must update it.
      - name: Licence notices check
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        run: python3 tools/notices.py --check
      # A prebuilt binary: the cargo-deny action is a container action, which on
      # the self-hosted runners would leave root-owned files in their work folders.
      - id: deny
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny
      - name: cargo deny check
        if: ${{ !cancelled() && steps.deny.outcome == 'success' }}
        run: cargo deny check
