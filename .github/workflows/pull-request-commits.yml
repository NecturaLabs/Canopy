name: Pull request commits

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  commits:
    name: Commit subjects and sign-offs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The default checkout is the PR merge ref, which contains both sides of the range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          SIGNOFF: >-
            ${{ github.event.pull_request.head.repo.id != github.event.pull_request.base.repo.id
                && github.event.pull_request.user.type != 'Bot' && 'required' || 'exempt' }}
        run: python3 -B tools/check-pr-commits.py "$PR_BASE" "$PR_HEAD" --signoff "$SIGNOFF"
