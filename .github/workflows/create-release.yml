# Creates a Canopy release. Run it by hand: Actions → Create release → Run workflow.
#
# A release is a build: its number is `git rev-list --count` of the commit on main (tools/release.py
# number), and the release is the tag `build-<number>` on that commit. Nothing is committed to main
# and no version is bumped; the build's number, short commit hash and release notes are embedded
# when the Release workflow builds it. A release is made only when a feat, fix, perf, revert or
# dependency commit is new since the last build tag; "force" releases anyway (docs, ci and chore
# commits alone change nothing for users). The release notes are the Conventional Commits since
# the last build tag (before the first one, the Unreleased section of CHANGELOG.md).
# "channel: beta" publishes the build to the beta update channel. "dry-run" only reports the
# build number it would release.
#
# It tags the tested commit and runs the Release workflow (release.yml) on the tag, which builds,
# publishes and updates the feed.
#
# Secrets: RELEASE_TOKEN only if tags are protected against creation by the workflow's own token:
# a token allowed to push the tag (best: a GitHub App on the ruleset's bypass list; a
# fine-grained token works too). Otherwise the workflow's own token is used. APP_UPDATES_TOKEN is
# passed on to the Release workflow.
name: Create release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: stable, or beta for the beta update channel
        type: choice
        options: [stable, beta]
        default: stable
      force:
        description: Release even when no feat, fix or perf commit is new
        type: boolean
        default: false
      dry-run:
        description: Only report the build number, change nothing
        type: boolean
        default: false

permissions: {}

# One release at a time.
concurrency:
  group: create-release
  cancel-in-progress: false

jobs:
  test:
    name: Test before tagging
    if: github.ref == 'refs/heads/main' && !inputs.dry-run
    permissions:
      contents: read
    uses: ./.github/workflows/test-release.yml
    with:
      commit: ${{ github.sha }}

  prepare:
    name: Build number and tag
    needs: [test]
    # A dry run skips tests and cannot tag; a real run proceeds only after tests pass.
    if: ${{ !cancelled() && (inputs.dry-run || needs.test.result == 'success') }}
    # A throwaway GitHub-hosted runner: this job holds a token that can push tags.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run Create release on main (it was started on $GITHUB_REF)."
          exit 1
      # The only checkout that keeps its credentials: this job pushes the tag. The whole history
      # and every tag, since the build number counts commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Decide the build
        id: plan
        env:
          FORCE: ${{ inputs.force }}
        run: |
          python3 tools/release.py selftest
          args=()
          [[ $FORCE == true ]] && args+=(--force)
          build=$(python3 tools/release.py plan "${args[@]}")
          if [[ -z $build ]]; then
            echo "::notice::Nothing to release: no feat, fix, perf, revert or dependency commit since the last build, or this commit is already a build. Choose force to release anyway."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/build-$build" > /dev/null; then
            echo "::error::build-$build already exists."
            exit 1
          fi
          echo "::notice::Next build: $build"
          echo "build=$build" >> "$GITHUB_OUTPUT"
      # Dispatched right after a merge, CI on the merged commit may still be running (or not yet
      # started): wait for it rather than refuse, up to 25 minutes (a full run takes about 10). A
      # dry run only looks.
      - name: Check the commit CI tested
        if: steps.plan.outputs.build != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TRIES: ${{ inputs.dry-run && 1 || 75 }}
        run: |
          sha=$(git rev-parse HEAD)
          for try in $(seq "$TRIES"); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "not run" else (.conclusion // .status) end') || state="unreadable"
            case $state in
              queued | in_progress | waiting | pending | requested) ;;
              "not run" | unreadable) (( try < 6 )) || break ;;
              *) break ;;
            esac
            (( try < TRIES )) || break
            echo "CI on $sha: $state; checking again in 20 seconds."
            sleep 20
          done
          if [[ $state != success ]]; then
            echo "::error::CI has not passed on main ($sha: $state). Release after it is green."
            exit 1
          fi
      - name: Tag and push
        id: push
        if: steps.plan.outputs.build != '' && !inputs.dry-run
        env:
          BUILD: ${{ steps.plan.outputs.build }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "build-$BUILD" -m "Canopy build $BUILD ($CHANNEL)"
          git push origin "refs/tags/build-$BUILD"
          echo "tag=build-$BUILD" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and publish
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      channel: ${{ inputs.channel }}
    # Only the feed token: RELEASE_TOKEN, which can push tags, stays in this workflow.
    secrets:
      APP_UPDATES_TOKEN: ${{ secrets.APP_UPDATES_TOKEN }}
