name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || !matrix.self-hosted) && matrix.os || fromJSON(matrix.self-hosted) }}
    # On the self-hosted runners (Ubuntu 24.04) the Linux build runs in an
    # Ubuntu 22.04 container to keep the same glibc floor.
    container: ${{ vars.USE_SELF_HOSTED != '0' && matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04, hosted or as the self-hosted container, keeps the glibc
          # requirement at 2.35.
          - os: ubuntu-22.04
            self-hosted: '["self-hosted", "linux", "wsl"]'
            container: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            self-hosted: '["self-hosted", "windows", "x64"]'
            target: x86_64-pc-windows-msvc
            archive: zip
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools in the container
        if: runner.os == 'Linux'
        run: |
          [[ -f /.dockerenv ]] || exit 0
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: ${{ matrix.target }}

      - name: Check tag matches workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $version" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked -p canopy-app --target ${{ matrix.target }}

      - name: Check the glibc requirement
        if: runner.os == 'Linux'
        run: |
          need=$(objdump -T target/${{ matrix.target }}/release/canopy | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "Requires $need"
          [[ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -n1)" == GLIBC_2.35 ]] \
            || { echo "The Linux build requires $need, newer than GLIBC_2.35" >&2; exit 1; }

      - name: Package
        run: |
          name="canopy-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          bin=target/${{ matrix.target }}/release/canopy
          [[ -f "$bin.exe" ]] && bin="$bin.exe"
          cp "$bin" README.md LICENSE "dist/$name/"
          if [[ "${{ matrix.target }}" == *linux* ]]; then
            cp packaging/linux/io.necturalabs.Canopy.desktop \
               packaging/linux/io.necturalabs.Canopy.metainfo.xml "dist/$name/"
            cp assets/icon.svg "dist/$name/io.necturalabs.Canopy.svg"
            cp assets/icon-256.png "dist/$name/io.necturalabs.Canopy.png"
          fi
          cd dist
          if [[ "${{ matrix.archive }}" == zip ]]; then
            if command -v 7z > /dev/null; then
              7z a -tzip "$name.zip" "$name" > /dev/null
            else
              # The self-hosted runners have no 7-Zip; Windows' own bsdtar writes zip.
              "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -a -cf "$name.zip" "$name"
            fi
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: canopy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The container runs as root on the runner's own work folder and home;
      # hand them back so the runner's next job can clean and reuse them.
      - name: Return container files to the runner's user
        if: always() && runner.os == 'Linux'
        run: |
          [[ -f /.dockerenv ]] || exit 0
          owner=$(stat -c %u:%g "$RUNNER_WORKSPACE")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$HOME"

  release:
    name: Publish release
    needs: build
    runs-on: ${{ vars.USE_SELF_HOSTED == '0' && 'ubuntu-latest' || fromJSON('["self-hosted", "linux", "wsl"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || { echo "No CHANGELOG.md section for $version" >&2; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          name: Canopy ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
