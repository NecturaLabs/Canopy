# Builds Canopy for every platform from a release tag, publishes the GitHub release and points
# the update feed at it. The "Create release" workflow (create-release.yml) calls it after
# tagging a release. Run it by hand (Actions → Release → Run workflow) with an existing tag to
# rebuild or republish that release. It never decides versions, and a pushed tag alone does not
# start it, so a release can never run twice.
#
# `publish-update` copies the builds to NecturaLabs/app-updates and commits the update manifest
# (`canopy/latest.json`, or `beta.json` for a pre-release), so running copies of Canopy offer the
# update. A stable release also commits the installers (`canopy/install.sh`, `canopy/install.ps1`,
# from packaging/), which the one-line install commands download from app-updates' main branch.
#
# Secrets (Settings → Secrets and variables → Actions):
# - APP_UPDATES_TOKEN (required for the update feed): fine-grained token, Contents read/write on
#   NecturaLabs/app-updates only. Without it the feed step is skipped with a warning.
# Variables: CANOPY_SENTRY_DSN overrides the built-in crash-report DSN (`off` disables crash
# reporting; unset keeps the built-in one);
# USE_SELF_HOSTED = '0' moves the builds to GitHub-hosted runners, as in CI.
#
# The builds keep to the self-hosted runners, but take nothing from earlier jobs on them: each
# starts from an empty workspace (a reused .git could carry hooks or config that run code) and
# installs rustup, the toolchain from rust-toolchain.toml and the crates into job-local homes
# under RUNNER_TEMP, with no build cache (setup-rust `isolated`).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing release tag, e.g. v0.2.0
        type: string
        required: true
  workflow_call:
    inputs:
      tag:
        description: The release tag, e.g. v0.2.0
        type: string
        required: true
    secrets:
      APP_UPDATES_TOKEN:
        description: Contents read/write on NecturaLabs/app-updates; without it the feed step is skipped
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ (vars.USE_SELF_HOSTED == '0' || !matrix.self-hosted) && matrix.os || fromJSON(matrix.self-hosted) }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental == true }}
    permissions:
      contents: read
    # On the self-hosted runners (Ubuntu 24.04) the Linux build runs in an
    # Ubuntu 22.04 container to keep the same glibc floor.
    container: ${{ vars.USE_SELF_HOSTED != '0' && matrix.container || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04, hosted or as the self-hosted container, keeps the glibc
          # requirement at 2.35.
          - os: ubuntu-22.04
            self-hosted: '["self-hosted", "linux", "wsl"]'
            container: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # The same Linux runner and container, cross-compiling with Ubuntu's aarch64 GCC
          # (glibc 2.35 as well). Experimental until a release has shipped it: a failure here
          # does not hold back the other platforms.
          - os: ubuntu-22.04
            self-hosted: '["self-hosted", "linux", "wsl"]'
            container: ubuntu:22.04@sha256:b8b6ee6aa931ecd9d0d952abc34dc0e5f7c6a30c6bb71b079fe399fde0329c02
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            experimental: true
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # Intel Macs: cross-compiled on the Apple silicon runner (Xcode's SDK covers both).
          # Experimental until a release has shipped it.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            experimental: true
          - os: windows-latest
            self-hosted: '["self-hosted", "windows", "x64"]'
            target: x86_64-pc-windows-msvc
            archive: zip
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - name: Install build tools in the container
        if: runner.os == 'Linux'
        run: |
          [[ -f /.dockerenv ]] || exit 0
          cross=()
          [[ $TARGET == aarch64-unknown-linux-gnu ]] && cross=(gcc-aarch64-linux-gnu libc6-dev-arm64-cross)
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config "${cross[@]}"
      - name: Install the aarch64 cross toolchain on a hosted runner
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          [[ -f /.dockerenv ]] && exit 0
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      # actions/checkout would otherwise fetch into the .git an earlier job left behind.
      - name: Start from an empty workspace
        if: runner.environment == 'self-hosted' && runner.os != 'Windows'
        run: |
          [[ -d $GITHUB_WORKSPACE ]] || exit 0
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
      - name: Start from an empty workspace
        if: runner.environment == 'self-hosted' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:GITHUB_WORKSPACE) {
            Get-ChildItem -Force -LiteralPath $env:GITHUB_WORKSPACE | Remove-Item -Recurse -Force
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          isolated: "true"

      - name: Check tag matches workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "v$version" != "$TAG" ]]; then
            echo "Tag $TAG does not match workspace version $version" >&2
            exit 1
          fi

      - name: Cross-compilation settings
        run: |
          case $TARGET in
            aarch64-unknown-linux-gnu)
              # The C parts (libgit2, zlib, ring) and the link use the cross GCC. pkg-config stays
              # off for the foreign target, so the vendored C sources are built.
              {
                echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
                echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
                echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
                echo "OBJDUMP=aarch64-linux-gnu-objdump"
              } >> "$GITHUB_ENV" ;;
            *-apple-darwin)
              # Both Mac builds target macOS 11, matching LSMinimumSystemVersion in Info.plist.
              echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV" ;;
          esac

      - name: Build
        run: cargo build --release --locked -p canopy-app --target "$TARGET"
        env:
          CANOPY_SENTRY_DSN: ${{ vars.CANOPY_SENTRY_DSN }}

      - name: Check the glibc requirement
        if: runner.os == 'Linux'
        run: |
          need=$("${OBJDUMP:-objdump}" -T "target/$TARGET/release/canopy" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "Requires $need"
          [[ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -n1)" == GLIBC_2.35 ]] \
            || { echo "The Linux build requires $need, newer than GLIBC_2.35" >&2; exit 1; }

      - name: Package
        run: |
          name="canopy-${TAG#v}-$TARGET"
          mkdir -p "dist/$name/legal"
          bin="target/$TARGET/release/canopy"
          [[ -f "$bin.exe" ]] && bin="$bin.exe"
          cp README.md LICENSE "dist/$name/"
          cp docs/legal/*.md docs/legal/third-party-notices.txt "dist/$name/legal/"
          if [[ "$TARGET" == *apple-darwin ]]; then
            # A minimal, ad-hoc signed Canopy.app (bundle id io.necturalabs.Canopy) with the
            # icon converted from assets/icon-512.png. packaging/install.sh installs it into
            # ~/Applications. Not notarised.
            version="${TAG#v}"
            app="dist/$name/Canopy.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/legal"
            cp "$bin" "$app/Contents/MacOS/canopy"
            sed -e "s/@VERSION@/$version/g" -e "s/@BUNDLE_VERSION@/${version%%-*}/g" \
              packaging/macos/Info.plist > "$app/Contents/Info.plist"
            plutil -lint "$app/Contents/Info.plist"
            printf 'APPL????' > "$app/Contents/PkgInfo"
            iconset="$RUNNER_TEMP/Canopy.iconset"
            rm -rf "$iconset" && mkdir -p "$iconset"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" assets/icon-512.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
              double=$((size * 2))
              if (( double <= 512 )); then
                sips -z "$double" "$double" assets/icon-512.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
              fi
            done
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/Canopy.icns"
            cp LICENSE "$app/Contents/Resources/"
            cp docs/legal/*.md docs/legal/third-party-notices.txt "$app/Contents/Resources/legal/"
            codesign --force --sign - "$app"
            codesign --verify --strict "$app"
          else
            cp "$bin" "dist/$name/"
          fi
          if [[ "$TARGET" == *linux* ]]; then
            cp packaging/linux/io.necturalabs.Canopy.desktop \
               packaging/linux/io.necturalabs.Canopy.metainfo.xml "dist/$name/"
            cp assets/icon.svg "dist/$name/io.necturalabs.Canopy.svg"
            cp assets/icon-256.png "dist/$name/io.necturalabs.Canopy.png"
          fi
          cd dist
          if [[ "$ARCHIVE" == zip ]]; then
            if command -v 7z > /dev/null; then
              7z a -tzip "$name.zip" "$name" > /dev/null
            else
              # The self-hosted runners have no 7-Zip; Windows' own bsdtar writes zip.
              "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -a -cf "$name.zip" "$name"
            fi
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canopy-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The container runs as root on the runner's own work folder and home;
      # remove the job-local Rust homes and hand the rest back so the runner's
      # next job can clean and reuse them.
      - name: Return container files to the runner's user
        if: always() && runner.os == 'Linux'
        run: |
          [[ -f /.dockerenv ]] || exit 0
          rm -rf "$RUNNER_TEMP/canopy-rust"
          owner=$(stat -c %u:%g "$RUNNER_WORKSPACE")
          chown -R "$owner" "$GITHUB_WORKSPACE" "$HOME"

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Add the installers
        run: cp packaging/install.sh packaging/install.ps1 dist/
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: python3 tools/release.py notes "${TAG#v}" > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag }}
          name: Canopy ${{ inputs.tag }}
          body_path: notes.md
          prerelease: ${{ contains(inputs.tag, '-') }}
          files: dist/*
          fail_on_unmatched_files: true

  publish-update:
    name: Publish to the update feed
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check for the token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.APP_UPDATES_TOKEN != '' }}
        run: |
          if [[ "$HAS_TOKEN" != true ]]; then
            echo "::warning::APP_UPDATES_TOKEN is not set: running copies of Canopy will not be offered this release."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.token.outputs.present == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Prepare the feed release
        if: steps.token.outputs.present == 'true'
        id: feed
        run: |
          VERSION="${TAG#v}"
          cp packaging/install.sh packaging/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          python3 tools/release.py notes "$VERSION" > notes.md
          prerelease=false
          [[ "$VERSION" == *-* ]] && prerelease=true
          {
            echo "tag=canopy-v$VERSION"
            echo "version=$VERSION"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: steps.token.outputs.present == 'true'
        with:
          repository: NecturaLabs/app-updates
          token: ${{ secrets.APP_UPDATES_TOKEN }}
          tag_name: ${{ steps.feed.outputs.tag }}
          target_commitish: main
          name: Canopy ${{ inputs.tag }}
          body_path: notes.md
          prerelease: ${{ steps.feed.outputs.prerelease == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
      - name: Commit the update manifest
        if: steps.token.outputs.present == 'true'
        env:
          APP_UPDATES_TOKEN: ${{ secrets.APP_UPDATES_TOKEN }}
          VERSION: ${{ steps.feed.outputs.version }}
          FEED_TAG: ${{ steps.feed.outputs.tag }}
          PRERELEASE: ${{ steps.feed.outputs.prerelease }}
        run: |
          channel=latest
          [[ "$PRERELEASE" == true ]] && channel=beta
          work="$RUNNER_TEMP/app-updates"
          rm -rf "$work"
          # The token travels in an HTTP header set through the environment: never in a URL, the
          # process list, the log or the clone's configuration.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_UPDATES_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth"
          git clone --depth 1 https://github.com/NecturaLabs/app-updates.git "$work"
          mkdir -p "$work/canopy"
          manifest="$work/canopy/$channel.json"
          # Never move a channel backwards (a hotfix tagged after a newer release).
          if [[ -f $manifest ]]; then
            current=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$manifest")
            highest=$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -1)
            if [[ $current != "$VERSION" && $highest == "$current" ]]; then
              echo "::warning::The $channel channel already offers $current; not replacing it with $VERSION."
              exit 0
            fi
          fi
          tools/update-manifest.sh dist "$VERSION" \
            "https://github.com/NecturaLabs/app-updates/releases/tag/$FEED_TAG" \
            "https://github.com/NecturaLabs/app-updates/releases/download/$FEED_TAG" \
            > "$manifest"
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add "canopy/$channel.json"
          # The one-line installers live next to the manifests. Only a stable release replaces
          # them, so a pre-release never changes what new users run.
          if [[ $channel == latest ]]; then
            cp packaging/install.sh packaging/install.ps1 "$work/canopy/"
            git -C "$work" add canopy/install.sh canopy/install.ps1
          fi
          if git -C "$work" diff --cached --quiet; then
            echo "The $channel manifest already describes $VERSION."
            exit 0
          fi
          git -C "$work" commit -m "canopy: publish $VERSION to the $channel channel"
          git -C "$work" push origin main
      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/app-updates"
