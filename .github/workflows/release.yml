# Builds Canopy from a build tag (`build-<number>`) for the platforms the CI variables turn on (the
# `platforms` job), publishes the GitHub release and points the update feed at it. The "Create
# release" workflow (create-release.yml) calls it after tagging a build. Run it by hand (Actions →
# Release → Run workflow) with an existing tag, and the channel it was released to, to finish or
# republish that build; once its release is published, that release's own files ship, never a
# rebuild. It never decides builds, and a pushed tag alone does not start it, so a
# release can never run twice.
#
# The `identity` job checks that the tag's number is the commit count of a commit on main, writes
# the release notes and names the build; the builds embed that number, the commit's short hash and
# the notes (crates/canopy-app/build.rs), and the archives are `canopy-build-<number>-<target>`.
#
# `publish-update` copies the builds to NecturaLabs/app-updates and commits the update manifest
# (`canopy/latest.json`, or `beta.json` for the beta channel), so running copies of Canopy offer
# the update. A stable release also commits the installers (`canopy/install.sh`,
# `canopy/install.ps1`, from packaging/), which the one-line install commands download from
# app-updates' main branch, and also points `beta.json` at the same build unless the beta channel
# already offers a newer one.
#
# The experimental targets (`platforms`) build alongside in `build-experimental`, which may fail:
# the release and the feed wait for it and are published from the required builds plus the
# experimental archives that built. Both releases are immutable (repository setting): each is
# created as a draft, gets every file, and only then is published, after which nothing can be
# added, changed or removed and its tag cannot move.
#
# Secrets: APP_UPDATES_TOKEN (required for the update feed), a fine-grained token with Contents
# read/write on NecturaLabs/app-updates only, is a secret of the `release` environment (Settings →
# Environments), which only main can use; only the jobs that write the feed declare it. Without
# it the feed step is skipped with a warning. MANIFEST_SIGNING_KEY, in the same environment, is
# the Ed25519 key (PEM) that signs each manifest; Canopy refuses a manifest without a valid
# signature (packaging/update-signing.pub, canopy_hosting::updates::MANIFEST_KEYS).
# Variables: CANOPY_SENTRY_DSN overrides the built-in crash-report DSN (`off` disables crash
# reporting; unset keeps the built-in one);
# CI_LINUX, CI_MACOS and CI_WINDOWS pick the platforms (the `platforms` job).
#
# Every job runs on GitHub-hosted runners, so a release is built on a fresh machine. The builds
# also install rustup, the latest stable toolchain and the crates into job-local homes under
# RUNNER_TEMP, with no build cache (setup-rust `isolated`).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing build tag, e.g. build-412
        type: string
        required: true
      channel:
        description: The update channel the build was released to
        type: choice
        options: [stable, beta]
        default: stable
  workflow_call:
    inputs:
      tag:
        description: The build tag, e.g. build-412
        type: string
        required: true
      channel:
        description: The update channel, stable or beta
        type: string
        default: stable

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}
  CHANNEL: ${{ inputs.channel }}

jobs:
  # Names the build: the tag must be build-<number>, where <number> is the commit count of the
  # tagged commit, and that commit must be on main.
  identity:
    name: Build identity and notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.name.outputs.build }}
      commit: ${{ steps.name.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Name the build
        id: name
        run: |
          if [[ ! $TAG =~ ^build-([1-9][0-9]{0,8})$ ]]; then
            echo "::error::$TAG is not a build tag (build-<number>)."
            exit 1
          fi
          build=${BASH_REMATCH[1]}
          [[ $CHANNEL == stable || $CHANNEL == beta ]] || { echo "::error::channel must be stable or beta, not $CHANNEL."; exit 1; }
          count=$(python3 tools/release.py number)
          if [[ $count != "$build" ]]; then
            echo "::error::$TAG is on a commit with $count commits behind it: the tag must be build-$count."
            exit 1
          fi
          # The checkout holds every branch (fetch-depth 0), so main is here without the network.
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::$TAG is not on main."
            exit 1
          fi
          python3 tools/release.py notes > notes.md
          {
            echo "build=$build"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error
          # Only this run's later jobs read it; 3 days covers rerunning a failed job, and storage
          # beyond that counts against the organisation's monthly Actions quota.
          retention-days: 3

  test:
    name: Test before publishing
    needs: [identity]
    permissions:
      contents: read
    uses: ./.github/workflows/test-release.yml
    with:
      commit: ${{ needs.identity.outputs.commit }}

  # The platforms to build follow the same repository variables as CI's test job: Linux unless
  # CI_LINUX is '0', macOS and Windows only when CI_MACOS or CI_WINDOWS is '1'. Ubuntu 22.04
  # keeps the glibc requirement at 2.35; aarch64 Linux (cross-compiled on the same runner) and
  # Intel macOS (cross-compiled on Apple silicon)
  # are experimental: they build in a job of their own that may fail; the release waits for it and
  # ships the archives that built.
  platforms:
    name: Platforms
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      required: ${{ steps.pick.outputs.required }}
      experimental: ${{ steps.pick.outputs.experimental }}
    steps:
      - id: pick
        env:
          CI_LINUX: ${{ vars.CI_LINUX }}
          CI_MACOS: ${{ vars.CI_MACOS }}
          CI_WINDOWS: ${{ vars.CI_WINDOWS }}
        run: |
          linux='[
            {"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","archive":"tar.gz"},
            {"os":"ubuntu-22.04","target":"aarch64-unknown-linux-gnu","archive":"tar.gz","experimental":true}]'
          macos='[
            {"os":"macos-latest","target":"aarch64-apple-darwin","archive":"tar.gz"},
            {"os":"macos-latest","target":"x86_64-apple-darwin","archive":"tar.gz","experimental":true}]'
          windows='[
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","archive":"zip"}]'
          on=()
          [[ $CI_LINUX != 0 ]] && on+=("$linux")
          [[ $CI_MACOS == 1 ]] && on+=("$macos")
          [[ $CI_WINDOWS == 1 ]] && on+=("$windows")
          if (( ${#on[@]} == 0 )); then
            echo "::error::Every platform is turned off (CI_LINUX, CI_MACOS, CI_WINDOWS)."
            exit 1
          fi
          matrix=$(printf '%s\n' "${on[@]}" | jq -cs 'add')
          echo "Building: $(jq -r 'map(.target) | join(", ")' <<<"$matrix")"
          {
            echo "required=$(jq -c 'map(select(.experimental != true))' <<<"$matrix")"
            echo "experimental=$(jq -c 'map(select(.experimental == true))' <<<"$matrix")"
          } >> "$GITHUB_OUTPUT"

  # The builds the release is published from. The slowest one measured took 16 minutes.
  build:
    name: Build (${{ matrix.target }})
    needs: [platforms, identity]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.required) }}
    defaults: &build-defaults
      run:
        shell: bash
    env: &build-env
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
      BUILD: ${{ needs.identity.outputs.build }}
      CANOPY_BUILD_NUMBER: ${{ needs.identity.outputs.build }}
      CANOPY_COMMIT: ${{ needs.identity.outputs.commit }}
    steps: &build-steps
      - name: Install the aarch64 cross toolchain
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: true
      # It takes under a minute and a half; a stalled download once held it for the job's whole
      # hour (#144). A step that runs out of time fails rather than cancels the job.
      - uses: ./.github/actions/setup-rust
        timeout-minutes: 10
        with:
          targets: ${{ matrix.target }}
          isolated: "true"

      - name: Check the checkout is the tagged commit
        run: |
          [[ "$(git rev-parse HEAD)" == "$CANOPY_COMMIT" ]] || { echo "The checkout is not the commit $CANOPY_COMMIT that $TAG names" >&2; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Cross-compilation settings
        run: |
          case $TARGET in
            aarch64-unknown-linux-gnu)
              # The C parts (libgit2, zlib, ring) and the link use the cross GCC. pkg-config stays
              # off for the foreign target, so the vendored C sources are built.
              {
                echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
                echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
                echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
                echo "OBJDUMP=aarch64-linux-gnu-objdump"
              } >> "$GITHUB_ENV" ;;
            *-apple-darwin)
              # Both Mac builds target macOS 11, matching LSMinimumSystemVersion in Info.plist.
              echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV" ;;
          esac

      # Measured: 4 to 14 minutes. Inside the job's own limit, so an experimental build that runs
      # out of time fails (which continue-on-error absorbs) instead of being cancelled.
      - name: Build
        timeout-minutes: ${{ matrix.experimental && 15 || 25 }}
        run: cargo build --release --locked -p canopy-app --target "$TARGET"
        env:
          CANOPY_SENTRY_DSN: ${{ vars.CANOPY_SENTRY_DSN }}
          CANOPY_RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes/notes.md

      - name: Check the glibc requirement
        if: runner.os == 'Linux'
        run: |
          need=$("${OBJDUMP:-objdump}" -T "target/$TARGET/release/canopy" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "Requires $need"
          [[ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -n1)" == GLIBC_2.35 ]] \
            || { echo "The Linux build requires $need, newer than GLIBC_2.35" >&2; exit 1; }

      - name: Package
        run: |
          name="canopy-build-$BUILD-$TARGET"
          mkdir -p "dist/$name/legal"
          bin="target/$TARGET/release/canopy"
          [[ -f "$bin.exe" ]] && bin="$bin.exe"
          cp README.md "dist/$name/"
          # One LICENSE file in the archive (the installers and the updater expect that name),
          # holding both licences the source is offered under.
          {
            printf 'Canopy is licensed under either of the Apache License, Version 2.0 or the MIT\n'
            printf 'License, at your option. The source is at https://github.com/NecturaLabs/Canopy.\n\n'
            printf -- '--- MIT License ---\n\n'
            cat LICENSE-MIT
            printf -- '\n--- Apache License, Version 2.0 ---\n\n'
            cat LICENSE-APACHE
          } > "dist/$name/LICENSE"
          cp docs/legal/*.md docs/legal/third-party-notices.txt "dist/$name/legal/"
          if [[ "$TARGET" == *apple-darwin ]]; then
            # A minimal, ad-hoc signed Canopy.app (bundle id io.necturalabs.Canopy) with the
            # icon converted from assets/icon-512.png. packaging/install.sh installs it into
            # ~/Applications. Not notarised.
            app="dist/$name/Canopy.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/legal"
            cp "$bin" "$app/Contents/MacOS/canopy"
            sed -e "s/@BUILD@/$BUILD/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
            plutil -lint "$app/Contents/Info.plist"
            printf 'APPL????' > "$app/Contents/PkgInfo"
            iconset="$RUNNER_TEMP/Canopy.iconset"
            rm -rf "$iconset" && mkdir -p "$iconset"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" assets/icon-512.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
              double=$((size * 2))
              if (( double <= 512 )); then
                sips -z "$double" "$double" assets/icon-512.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
              fi
            done
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/Canopy.icns"
            cp "dist/$name/LICENSE" "$app/Contents/Resources/"
            cp docs/legal/*.md docs/legal/third-party-notices.txt "$app/Contents/Resources/legal/"
            codesign --force --sign - "$app"
            codesign --verify --strict "$app"
          else
            cp "$bin" "dist/$name/"
          fi
          if [[ "$TARGET" == *linux* ]]; then
            cp packaging/linux/io.necturalabs.Canopy.desktop "dist/$name/"
            # This build's entry first in the AppStream release list.
            sed "s|<releases>|<releases>\n    <release version=\"$BUILD\" date=\"$(date -u +%F)\"/>|" \
              packaging/linux/io.necturalabs.Canopy.metainfo.xml > "dist/$name/io.necturalabs.Canopy.metainfo.xml"
            cp assets/icon-256.png "dist/$name/io.necturalabs.Canopy.png"
          fi
          cd dist
          if [[ "$ARCHIVE" == zip ]]; then
            if command -v 7z > /dev/null; then
              7z a -tzip "$name.zip" "$name" > /dev/null
            else
              # Windows' own bsdtar writes zip, with no 7-Zip needed.
              "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -a -cf "$name.zip" "$name"
            fi
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      # Publishing takes the canopy-* artifacts and the experimental-* ones that built.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.experimental && 'experimental' || 'canopy' }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          # Only this run's later jobs read it; 3 days covers rerunning a failed job, and storage
          # beyond that counts against the organisation's monthly Actions quota.
          retention-days: 3

  # The same steps for the experimental targets. Publishing waits for this job but not for its
  # success: a failure, a hang or its timeout (measured: 5 to 16 minutes, once a stalled download
  # for an hour) only leaves their archives out. A job still queued for a runner holds the release
  # until a runner takes it and it ends; there is no switch for the experimental targets alone.
  build-experimental:
    name: Build (${{ matrix.target }}, experimental)
    needs: [platforms, identity]
    if: needs.platforms.outputs.experimental != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.experimental) }}
    defaults: *build-defaults
    env: *build-env
    steps: *build-steps

  release:
    name: Publish release
    needs: [identity, platforms, build, build-experimental, test]
    # An experimental build that failed or was skipped never holds the release back.
    if: ${{ !cancelled() && needs.identity.result == 'success' && needs.build.result == 'success' && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }} # the commit the identity job checked, even if the tag moved
          persist-credentials: false
      # A published release is immutable. A rerun or a new dispatch for its tag ships the files it
      # published, never the ones this run rebuilt, so the feed's checksums match what users get.
      - name: Is the release already published
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          err="$RUNNER_TEMP/release-view.err"
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2> "$err"); then
            :
          elif grep -qi 'release not found' "$err"; then
            draft=missing
          else
            echo "::error::Reading release $TAG failed: $(tr '\n' ' ' < "$err")"
            exit 1
          fi
          published=false
          if [[ $draft == false ]]; then
            published=true
            echo "::notice::Release $TAG is already published; this run ships its published files."
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - name: Take the published files
        if: steps.state.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'canopy-build-*' --dir dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.state.outputs.published != 'true'
        with:
          pattern: canopy-*
          path: dist
          merge-multiple: true
      # The experimental archives that built (none when every one failed or none was on).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.state.outputs.published != 'true' && needs.platforms.outputs.experimental != '[]'
        continue-on-error: true
        with:
          pattern: experimental-*
          path: late
          merge-multiple: true
      - name: Add the experimental archives
        if: steps.state.outputs.published != 'true'
        env:
          BUILD: ${{ needs.identity.outputs.build }}
          EXPECTED: ${{ needs.platforms.outputs.experimental }}
        run: |
          for target in $(jq -r '.[].target' <<<"$EXPECTED"); do
            if compgen -G "late/canopy-build-$BUILD-$target.*" > /dev/null; then
              cp late/canopy-build-"$BUILD-$target".* dist/
            else
              echo "::warning::No experimental $target archive was found (the build failed, timed out or could not be downloaded): build $BUILD ships without it."
            fi
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Add the installers
        run: cp packaging/install.sh packaging/install.ps1 dist/
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      # The published files and installers must be exactly the ones the release lists.
      - name: Match the published checksums
        if: steps.state.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --output "$RUNNER_TEMP/published-sums"
          if ! diff -u "$RUNNER_TEMP/published-sums" dist/SHA256SUMS; then
            echo "::error::The files of release $TAG do not match its SHA256SUMS."
            exit 1
          fi
      # Signed SLSA build provenance for every file the release publishes (SECURITY.md has the
      # verify command): the archives, the installers and the checksum list.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.state.outputs.published != 'true'
        with:
          subject-path: |
            dist/canopy-build-*
            dist/install.sh
            dist/install.ps1
            dist/SHA256SUMS
      # Earlier releases are removed once this one is out (the prune job): their notes live on in
      # the feed's changelog, which the release page links to.
      - name: Release page text
        run: |
          {
            cat notes/notes.md
            printf '\n\nEarlier builds: [release notes](https://github.com/NecturaLabs/app-updates/blob/main/canopy/CHANGELOG.md)\n'
          } > notes/release.md
      # Before publishing, so nothing after the point of no return can fail.
      - name: Hand the files to the feed job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/canopy-build-*
          if-no-files-found: error
          overwrite: true
          retention-days: 3
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: steps.state.outputs.published != 'true'
        with:
          tag_name: ${{ inputs.tag }}
          name: Canopy build ${{ needs.identity.outputs.build }}
          body_path: notes/release.md
          prerelease: ${{ inputs.channel == 'beta' }}
          # A draft takes every file; publishing it then makes it immutable.
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
      - name: Publish the release
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

  publish-update:
    name: Publish to the update feed
    needs: [identity, release]
    # Explicit: an experimental build that failed upstream must not skip the feed.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # APP_UPDATES_TOKEN is a secret of this environment (main only).
    environment: release
    permissions:
      contents: read
    steps:
      - name: Check for the token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.APP_UPDATES_TOKEN != '' }}
          HAS_KEY: ${{ secrets.MANIFEST_SIGNING_KEY != '' }}
        run: |
          if [[ "$HAS_TOKEN" != true ]]; then
            echo "::warning::APP_UPDATES_TOKEN is not set: running copies of Canopy will not be offered this release."
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [[ "$HAS_KEY" != true ]]; then
            # Canopy refuses an unsigned manifest: fail before anything reaches the feed.
            echo "::error::MANIFEST_SIGNING_KEY is not set in the release environment: the update manifest cannot be signed."
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      # The archives the GitHub release published, experimental ones included.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: release-files
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: release-notes
          path: notes
      - name: Prepare the feed release
        if: steps.token.outputs.present == 'true'
        id: feed
        env:
          BUILD: ${{ needs.identity.outputs.build }}
        run: |
          cp packaging/install.sh packaging/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          prerelease=false
          [[ "$CHANNEL" == beta ]] && prerelease=true
          {
            echo "tag=canopy-build-$BUILD"
            echo "build=$BUILD"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      # A rerun after the feed release was published (say, the manifest push failed) leaves it as
      # it is and goes on to the manifest.
      - name: Is the feed release already published
        if: steps.token.outputs.present == 'true'
        id: feedstate
        env:
          GH_TOKEN: ${{ secrets.APP_UPDATES_TOKEN }}
          FEED_TAG: ${{ steps.feed.outputs.tag }}
        run: |
          err="$RUNNER_TEMP/release-view.err"
          if draft=$(gh release view "$FEED_TAG" --repo NecturaLabs/app-updates --json isDraft --jq .isDraft 2> "$err"); then
            :
          elif grep -qi 'release not found' "$err"; then
            draft=missing
          else
            echo "::error::Reading feed release $FEED_TAG failed: $(tr '\n' ' ' < "$err")"
            exit 1
          fi
          published=false
          if [[ $draft == false ]]; then
            published=true
            # It must hold exactly the files the manifest is about to describe: the same list, and
            # every file matching it.
            feed="$RUNNER_TEMP/feed-files"
            rm -rf "$feed"
            gh release download "$FEED_TAG" --repo NecturaLabs/app-updates --dir "$feed"
            if ! diff -u "$feed/SHA256SUMS" dist/SHA256SUMS || ! (cd "$feed" && sha256sum --check --quiet SHA256SUMS); then
              echo "::error::Feed release $FEED_TAG is published with other files than release $TAG."
              exit 1
            fi
            echo "::notice::Feed release $FEED_TAG is already published with the same files; leaving it as it is."
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: steps.token.outputs.present == 'true' && steps.feedstate.outputs.published != 'true'
        with:
          repository: NecturaLabs/app-updates
          token: ${{ secrets.APP_UPDATES_TOKEN }}
          tag_name: ${{ steps.feed.outputs.tag }}
          target_commitish: main
          name: Canopy build ${{ steps.feed.outputs.build }}
          body_path: notes/notes.md
          prerelease: ${{ steps.feed.outputs.prerelease == 'true' }}
          # Immutable once published, like the GitHub release: a draft takes every file first.
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
      - name: Publish the feed release
        if: steps.token.outputs.present == 'true' && steps.feedstate.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ secrets.APP_UPDATES_TOKEN }}
          FEED_TAG: ${{ steps.feed.outputs.tag }}
        run: gh release edit "$FEED_TAG" --draft=false --repo NecturaLabs/app-updates
      # The manifest is written, signed and pushed in three steps, so the signing key and the
      # feed token are never in the same step. The feed repository is public: the clone needs no
      # token.
      - name: Write the update manifest
        id: manifest
        if: steps.token.outputs.present == 'true'
        env:
          BUILD: ${{ steps.feed.outputs.build }}
          FEED_TAG: ${{ steps.feed.outputs.tag }}
          PRERELEASE: ${{ steps.feed.outputs.prerelease }}
        run: |
          channel=latest
          [[ "$PRERELEASE" == true ]] && channel=beta
          work="$RUNNER_TEMP/app-updates"
          rm -rf "$work"
          git clone --depth 1 https://github.com/NecturaLabs/app-updates.git "$work"
          mkdir -p "$work/canopy"
          manifest="$work/canopy/$channel.json"
          # Never move a channel backwards (a rebuild of an older build). A manifest that names no
          # build number (the semantic version of a feed from before builds were numbered) is
          # older than every build.
          built() {
            python3 -c 'import json,re,sys; v = str(json.load(open(sys.argv[1])).get("version", "")); print(v if re.fullmatch(r"[0-9]+", v) else 0)' "$1"
          }
          if [[ -f $manifest ]]; then
            current=$(built "$manifest")
            if (( current > BUILD )); then
              echo "::warning::The $channel channel already offers build $current; not replacing it with build $BUILD."
              echo "write=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          tools/update-manifest.sh dist "$BUILD" \
            "https://github.com/NecturaLabs/app-updates/releases/tag/$FEED_TAG" \
            "https://github.com/NecturaLabs/app-updates/releases/download/$FEED_TAG" \
            notes/notes.md \
            > "$manifest"
          signed="canopy/$channel.json"
          # A stable build is also the newest build for beta copies: the beta manifest names the
          # same feed release, unless it already offers a newer (beta) build.
          also=""
          if [[ $channel == latest ]]; then
            beta="$work/canopy/beta.json"
            beta_current=$(built "$beta" 2>/dev/null) || beta_current=0
            if [[ ! -f $beta ]] || (( beta_current <= BUILD )); then
              cp "$manifest" "$beta"
              signed+=" canopy/beta.json"
              also=" and the beta channel"
            fi
          fi
          {
            echo "write=true"
            echo "channel=$channel"
            echo "signed=$signed"
            echo "also=$also"
          } >> "$GITHUB_OUTPUT"
      # Canopy trusts a manifest only with a valid signature beside it (tools/sign-manifest.py).
      - name: Sign the update manifest
        if: steps.manifest.outputs.write == 'true'
        env:
          CANOPY_MANIFEST_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
          SIGNED: ${{ steps.manifest.outputs.signed }}
        working-directory: ${{ runner.temp }}/app-updates
        run: |
          # shellcheck disable=SC2086 # SIGNED is a list of feed paths without spaces
          python3 "$GITHUB_WORKSPACE/tools/sign-manifest.py" sign "$GITHUB_WORKSPACE/packaging/update-signing.pub" $SIGNED
      - name: Publish the update manifest
        if: steps.manifest.outputs.write == 'true'
        env:
          APP_UPDATES_TOKEN: ${{ secrets.APP_UPDATES_TOKEN }}
          BUILD: ${{ steps.feed.outputs.build }}
          CHANNEL: ${{ steps.manifest.outputs.channel }}
          SIGNED: ${{ steps.manifest.outputs.signed }}
          ALSO: ${{ steps.manifest.outputs.also }}
        run: |
          work="$RUNNER_TEMP/app-updates"
          # shellcheck disable=SC2086 # SIGNED is a list of feed paths without spaces
          for file in $SIGNED; do
            git -C "$work" add "$file" "$file.minisig"
          done
          # The one-line installers live next to the manifests. Only a stable release replaces
          # them, so a beta build never changes what new users run.
          if [[ $CHANNEL == latest ]]; then
            cp packaging/install.sh packaging/install.ps1 "$work/canopy/"
            git -C "$work" add canopy/install.sh canopy/install.ps1
          fi
          if git -C "$work" diff --cached --quiet; then
            echo "The $CHANNEL manifest already describes build $BUILD."
            exit 0
          fi
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" commit -m "canopy: publish build $BUILD to the $CHANNEL channel$ALSO"
          # The token travels in an HTTP header set through the environment: never in a URL, the
          # process list, the log or the clone's configuration.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_UPDATES_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth"
          git -C "$work" push origin main
      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/app-updates"

  # Once the build is out with its experimental archives, writes every Canopy feed release's notes
  # into app-updates' canopy/CHANGELOG.md and then deletes the releases no channel offers, in
  # app-updates (with their tags) and here (keeping the build-* tags, which tools/release.py
  # reads). Never the build just released or one a manifest offers (tools/prune-releases.py).
  prune:
    name: Remove the previous releases
    needs: [identity, publish-update]
    if: ${{ !cancelled() && needs.publish-update.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # APP_UPDATES_TOKEN is a secret of this environment (main only).
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identity.outputs.commit }}
          persist-credentials: false
      - name: Keep the notes and remove the previous releases
        env:
          APP_UPDATES_TOKEN: ${{ secrets.APP_UPDATES_TOKEN }}
          CANOPY_TOKEN: ${{ github.token }}
          BUILD: ${{ needs.identity.outputs.build }}
        run: |
          if [[ -z $APP_UPDATES_TOKEN ]]; then
            echo "::warning::APP_UPDATES_TOKEN is not set: the previous releases stay."
            exit 0
          fi
          work="$RUNNER_TEMP/app-updates"
          rm -rf "$work"
          # The token travels as in publish-update: in a header set through the environment.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_UPDATES_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth"
          git clone --depth 1 https://github.com/NecturaLabs/app-updates.git "$work"
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FEED_TOKEN=$APP_UPDATES_TOKEN python3 tools/prune-releases.py run --feed-dir "$work" --keep "$BUILD"
      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/app-updates"
