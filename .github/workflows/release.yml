# Builds Canopy from a build tag (`build-<number>`) for the platforms the CI variables turn on (the
# `platforms` job), publishes the GitHub release and points the update feed at it. The "Create
# release" workflow (create-release.yml) calls it after tagging a build. Run it by hand (Actions →
# Release → Run workflow) with an existing tag, and the channel it was released to, to rebuild or
# republish that build. It never decides builds, and a pushed tag alone does not start it, so a
# release can never run twice.
#
# The `identity` job checks that the tag's number is the commit count of a commit on main, writes
# the release notes and names the build; the builds embed that number, the commit's short hash and
# the notes (crates/canopy-app/build.rs), and the archives are `canopy-build-<number>-<target>`.
#
# `publish-update` copies the builds to NecturaLabs/app-updates and commits the update manifest
# (`canopy/latest.json`, or `beta.json` for the beta channel), so running copies of Canopy offer
# the update. A stable release also commits the installers (`canopy/install.sh`,
# `canopy/install.ps1`, from packaging/), which the one-line install commands download from
# app-updates' main branch, and also points `beta.json` at the same build unless the beta channel
# already offers a newer one.
#
# The release and the feed are published from the required builds only. The experimental targets
# (`platforms`) build alongside in `build-experimental`, which nothing waits for; once the release
# is out, `attach-experimental` adds the archives that built to both releases and to the feed
# manifests that still name the build.
#
# Secrets (Settings → Secrets and variables → Actions):
# - APP_UPDATES_TOKEN (required for the update feed): fine-grained token, Contents read/write on
#   NecturaLabs/app-updates only. Without it the feed step is skipped with a warning.
# Variables: CANOPY_SENTRY_DSN overrides the built-in crash-report DSN (`off` disables crash
# reporting; unset keeps the built-in one);
# CI_LINUX, CI_MACOS and CI_WINDOWS pick the platforms (the `platforms` job).
#
# Every job runs on GitHub-hosted runners, so a release is built on a fresh machine. The builds
# also install rustup, the latest stable toolchain and the crates into job-local homes under
# RUNNER_TEMP, with no build cache (setup-rust `isolated`).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: An existing build tag, e.g. build-412
        type: string
        required: true
      channel:
        description: The update channel the build was released to
        type: choice
        options: [stable, beta]
        default: stable
  workflow_call:
    inputs:
      tag:
        description: The build tag, e.g. build-412
        type: string
        required: true
      channel:
        description: The update channel, stable or beta
        type: string
        default: stable
    secrets:
      APP_UPDATES_TOKEN:
        description: Contents read/write on NecturaLabs/app-updates; without it the feed step is skipped
        required: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag }}
  CHANNEL: ${{ inputs.channel }}

jobs:
  # Names the build: the tag must be build-<number>, where <number> is the commit count of the
  # tagged commit, and that commit must be on main.
  identity:
    name: Build identity and notes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      build: ${{ steps.name.outputs.build }}
      commit: ${{ steps.name.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Name the build
        id: name
        run: |
          if [[ ! $TAG =~ ^build-([1-9][0-9]{0,8})$ ]]; then
            echo "::error::$TAG is not a build tag (build-<number>)."
            exit 1
          fi
          build=${BASH_REMATCH[1]}
          [[ $CHANNEL == stable || $CHANNEL == beta ]] || { echo "::error::channel must be stable or beta, not $CHANNEL."; exit 1; }
          count=$(python3 tools/release.py number)
          if [[ $count != "$build" ]]; then
            echo "::error::$TAG is on a commit with $count commits behind it: the tag must be build-$count."
            exit 1
          fi
          # The checkout holds every branch (fetch-depth 0), so main is here without the network.
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::$TAG is not on main."
            exit 1
          fi
          python3 tools/release.py notes > notes.md
          {
            echo "build=$build"
            echo "commit=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md
          if-no-files-found: error
          # Only this run's later jobs read it; 3 days covers rerunning a failed job, and storage
          # beyond that counts against the organisation's monthly Actions quota.
          retention-days: 3

  test:
    name: Test before publishing
    needs: [identity]
    permissions:
      contents: read
    uses: ./.github/workflows/test-release.yml
    with:
      commit: ${{ needs.identity.outputs.commit }}

  # The platforms to build follow the same repository variables as CI's test job: Linux unless
  # CI_LINUX is '0', macOS and Windows only when CI_MACOS or CI_WINDOWS is '1'. Ubuntu 22.04
  # keeps the glibc requirement at 2.35; aarch64 Linux (cross-compiled on the same runner) and
  # Intel macOS (cross-compiled on Apple silicon)
  # are experimental: they build in a job of their own that the release does not wait for, and
  # `attach-experimental` adds the archives that built once the release is out.
  platforms:
    name: Platforms
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      required: ${{ steps.pick.outputs.required }}
      experimental: ${{ steps.pick.outputs.experimental }}
    steps:
      - id: pick
        env:
          CI_LINUX: ${{ vars.CI_LINUX }}
          CI_MACOS: ${{ vars.CI_MACOS }}
          CI_WINDOWS: ${{ vars.CI_WINDOWS }}
        run: |
          linux='[
            {"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","archive":"tar.gz"},
            {"os":"ubuntu-22.04","target":"aarch64-unknown-linux-gnu","archive":"tar.gz","experimental":true}]'
          macos='[
            {"os":"macos-latest","target":"aarch64-apple-darwin","archive":"tar.gz"},
            {"os":"macos-latest","target":"x86_64-apple-darwin","archive":"tar.gz","experimental":true}]'
          windows='[
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","archive":"zip"}]'
          on=()
          [[ $CI_LINUX != 0 ]] && on+=("$linux")
          [[ $CI_MACOS == 1 ]] && on+=("$macos")
          [[ $CI_WINDOWS == 1 ]] && on+=("$windows")
          if (( ${#on[@]} == 0 )); then
            echo "::error::Every platform is turned off (CI_LINUX, CI_MACOS, CI_WINDOWS)."
            exit 1
          fi
          matrix=$(printf '%s\n' "${on[@]}" | jq -cs 'add')
          echo "Building: $(jq -r 'map(.target) | join(", ")' <<<"$matrix")"
          {
            echo "required=$(jq -c 'map(select(.experimental != true))' <<<"$matrix")"
            echo "experimental=$(jq -c 'map(select(.experimental == true))' <<<"$matrix")"
          } >> "$GITHUB_OUTPUT"

  # The builds the release is published from. The slowest one measured took 16 minutes.
  build:
    name: Build (${{ matrix.target }})
    needs: [platforms, identity]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.required) }}
    defaults: &build-defaults
      run:
        shell: bash
    env: &build-env
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
      BUILD: ${{ needs.identity.outputs.build }}
      CANOPY_BUILD_NUMBER: ${{ needs.identity.outputs.build }}
      CANOPY_COMMIT: ${{ needs.identity.outputs.commit }}
    steps: &build-steps
      - name: Install the aarch64 cross toolchain
        if: runner.os == 'Linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          submodules: true
      # It takes under a minute and a half; a stalled download once held it for the job's whole
      # hour (#144). A step that runs out of time fails rather than cancels the job.
      - uses: ./.github/actions/setup-rust
        timeout-minutes: 10
        with:
          targets: ${{ matrix.target }}
          isolated: "true"

      - name: Check the checkout is the tagged commit
        run: |
          [[ "$(git rev-parse HEAD)" == "$CANOPY_COMMIT" ]] || { echo "The checkout is not the commit $CANOPY_COMMIT that $TAG names" >&2; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      - name: Cross-compilation settings
        run: |
          case $TARGET in
            aarch64-unknown-linux-gnu)
              # The C parts (libgit2, zlib, ring) and the link use the cross GCC. pkg-config stays
              # off for the foreign target, so the vendored C sources are built.
              {
                echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc"
                echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc"
                echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar"
                echo "OBJDUMP=aarch64-linux-gnu-objdump"
              } >> "$GITHUB_ENV" ;;
            *-apple-darwin)
              # Both Mac builds target macOS 11, matching LSMinimumSystemVersion in Info.plist.
              echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV" ;;
          esac

      # Measured: 4 to 14 minutes. Inside the job's own limit, so an experimental build that runs
      # out of time fails (which continue-on-error absorbs) instead of being cancelled.
      - name: Build
        timeout-minutes: ${{ matrix.experimental && 15 || 25 }}
        run: cargo build --release --locked -p canopy-app --target "$TARGET"
        env:
          CANOPY_SENTRY_DSN: ${{ vars.CANOPY_SENTRY_DSN }}
          CANOPY_RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes/notes.md

      - name: Check the glibc requirement
        if: runner.os == 'Linux'
        run: |
          need=$("${OBJDUMP:-objdump}" -T "target/$TARGET/release/canopy" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -n1)
          echo "Requires $need"
          [[ "$(printf '%s\n' "$need" GLIBC_2.35 | sort -V | tail -n1)" == GLIBC_2.35 ]] \
            || { echo "The Linux build requires $need, newer than GLIBC_2.35" >&2; exit 1; }

      - name: Package
        run: |
          name="canopy-build-$BUILD-$TARGET"
          mkdir -p "dist/$name/legal"
          bin="target/$TARGET/release/canopy"
          [[ -f "$bin.exe" ]] && bin="$bin.exe"
          cp README.md LICENSE "dist/$name/"
          cp docs/legal/*.md docs/legal/third-party-notices.txt "dist/$name/legal/"
          if [[ "$TARGET" == *apple-darwin ]]; then
            # A minimal, ad-hoc signed Canopy.app (bundle id io.necturalabs.Canopy) with the
            # icon converted from assets/icon-512.png. packaging/install.sh installs it into
            # ~/Applications. Not notarised.
            app="dist/$name/Canopy.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/legal"
            cp "$bin" "$app/Contents/MacOS/canopy"
            sed -e "s/@BUILD@/$BUILD/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
            plutil -lint "$app/Contents/Info.plist"
            printf 'APPL????' > "$app/Contents/PkgInfo"
            iconset="$RUNNER_TEMP/Canopy.iconset"
            rm -rf "$iconset" && mkdir -p "$iconset"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" assets/icon-512.png --out "$iconset/icon_${size}x${size}.png" > /dev/null
              double=$((size * 2))
              if (( double <= 512 )); then
                sips -z "$double" "$double" assets/icon-512.png --out "$iconset/icon_${size}x${size}@2x.png" > /dev/null
              fi
            done
            iconutil -c icns "$iconset" -o "$app/Contents/Resources/Canopy.icns"
            cp LICENSE "$app/Contents/Resources/"
            cp docs/legal/*.md docs/legal/third-party-notices.txt "$app/Contents/Resources/legal/"
            codesign --force --sign - "$app"
            codesign --verify --strict "$app"
          else
            cp "$bin" "dist/$name/"
          fi
          if [[ "$TARGET" == *linux* ]]; then
            cp packaging/linux/io.necturalabs.Canopy.desktop "dist/$name/"
            # This build's entry first in the AppStream release list.
            sed "s|<releases>|<releases>\n    <release version=\"$BUILD\" date=\"$(date -u +%F)\"/>|" \
              packaging/linux/io.necturalabs.Canopy.metainfo.xml > "dist/$name/io.necturalabs.Canopy.metainfo.xml"
            cp assets/icon-256.png "dist/$name/io.necturalabs.Canopy.png"
          fi
          cd dist
          if [[ "$ARCHIVE" == zip ]]; then
            if command -v 7z > /dev/null; then
              7z a -tzip "$name.zip" "$name" > /dev/null
            else
              # Windows' own bsdtar writes zip, with no 7-Zip needed.
              "$(cygpath -u "$SYSTEMROOT")/System32/tar.exe" -a -cf "$name.zip" "$name"
            fi
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -rf "$name"

      # Publishing takes the canopy-* artifacts; experimental-* ones are added afterwards.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.experimental && 'experimental' || 'canopy' }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          # Only this run's later jobs read it; 3 days covers rerunning a failed job, and storage
          # beyond that counts against the organisation's monthly Actions quota.
          retention-days: 3

  # The same steps for the experimental targets. Nothing waits for this job: a failure, a hang or
  # its timeout (measured: 5 to 16 minutes, once a stalled download for an hour) only leaves their
  # archives out.
  build-experimental:
    name: Build (${{ matrix.target }}, experimental)
    needs: [platforms, identity]
    if: needs.platforms.outputs.experimental != '[]'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.experimental) }}
    defaults: *build-defaults
    env: *build-env
    steps: *build-steps

  release:
    name: Publish release
    needs: [identity, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: canopy-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: Add the installers
        run: cp packaging/install.sh packaging/install.ps1 dist/
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ inputs.tag }}
          name: Canopy build ${{ needs.identity.outputs.build }}
          body_path: notes/notes.md
          prerelease: ${{ inputs.channel == 'beta' }}
          files: dist/*
          fail_on_unmatched_files: true

  publish-update:
    name: Publish to the update feed
    needs: [identity, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check for the token
        id: token
        env:
          HAS_TOKEN: ${{ secrets.APP_UPDATES_TOKEN != '' }}
        run: |
          if [[ "$HAS_TOKEN" != true ]]; then
            echo "::warning::APP_UPDATES_TOKEN is not set: running copies of Canopy will not be offered this release."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.present == 'true'
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          pattern: canopy-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.token.outputs.present == 'true'
        with:
          name: release-notes
          path: notes
      - name: Prepare the feed release
        if: steps.token.outputs.present == 'true'
        id: feed
        env:
          BUILD: ${{ needs.identity.outputs.build }}
        run: |
          cp packaging/install.sh packaging/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          prerelease=false
          [[ "$CHANNEL" == beta ]] && prerelease=true
          {
            echo "tag=canopy-build-$BUILD"
            echo "build=$BUILD"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: steps.token.outputs.present == 'true'
        with:
          repository: NecturaLabs/app-updates
          token: ${{ secrets.APP_UPDATES_TOKEN }}
          tag_name: ${{ steps.feed.outputs.tag }}
          target_commitish: main
          name: Canopy build ${{ steps.feed.outputs.build }}
          body_path: notes/notes.md
          prerelease: ${{ steps.feed.outputs.prerelease == 'true' }}
          files: dist/*
          fail_on_unmatched_files: true
      - name: Commit the update manifest
        if: steps.token.outputs.present == 'true'
        env:
          APP_UPDATES_TOKEN: ${{ secrets.APP_UPDATES_TOKEN }}
          BUILD: ${{ steps.feed.outputs.build }}
          FEED_TAG: ${{ steps.feed.outputs.tag }}
          PRERELEASE: ${{ steps.feed.outputs.prerelease }}
        run: |
          channel=latest
          [[ "$PRERELEASE" == true ]] && channel=beta
          work="$RUNNER_TEMP/app-updates"
          rm -rf "$work"
          # The token travels in an HTTP header set through the environment: never in a URL, the
          # process list, the log or the clone's configuration.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_UPDATES_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth"
          git clone --depth 1 https://github.com/NecturaLabs/app-updates.git "$work"
          mkdir -p "$work/canopy"
          manifest="$work/canopy/$channel.json"
          # Never move a channel backwards (a rebuild of an older build). A manifest that names no
          # build number (the semantic version of a feed from before builds were numbered) is
          # older than every build.
          built() {
            python3 -c 'import json,re,sys; v = str(json.load(open(sys.argv[1])).get("version", "")); print(v if re.fullmatch(r"[0-9]+", v) else 0)' "$1"
          }
          if [[ -f $manifest ]]; then
            current=$(built "$manifest")
            if (( current > BUILD )); then
              echo "::warning::The $channel channel already offers build $current; not replacing it with build $BUILD."
              exit 0
            fi
          fi
          tools/update-manifest.sh dist "$BUILD" \
            "https://github.com/NecturaLabs/app-updates/releases/tag/$FEED_TAG" \
            "https://github.com/NecturaLabs/app-updates/releases/download/$FEED_TAG" \
            notes/notes.md \
            > "$manifest"
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" add "canopy/$channel.json"
          # A stable build is also the newest build for beta copies: the beta manifest names the
          # same feed release, unless it already offers a newer (beta) build.
          also=""
          if [[ $channel == latest ]]; then
            beta="$work/canopy/beta.json"
            beta_current=$(built "$beta" 2>/dev/null) || beta_current=0
            if [[ ! -f $beta ]] || (( beta_current <= BUILD )); then
              cp "$manifest" "$beta"
              git -C "$work" add canopy/beta.json
              also=" and the beta channel"
            fi
          fi
          # The one-line installers live next to the manifests. Only a stable release replaces
          # them, so a beta build never changes what new users run.
          if [[ $channel == latest ]]; then
            cp packaging/install.sh packaging/install.ps1 "$work/canopy/"
            git -C "$work" add canopy/install.sh canopy/install.ps1
          fi
          if git -C "$work" diff --cached --quiet; then
            echo "The $channel manifest already describes build $BUILD."
            exit 0
          fi
          git -C "$work" commit -m "canopy: publish build $BUILD to the $channel channel$also"
          git -C "$work" push origin main
      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/app-updates"

  # Once the release is out, adds the experimental archives that built to the GitHub release and
  # to the feed release, with a SHA256SUMS that covers every file, and rewrites each feed manifest
  # that still names this build to offer them. A manifest that moved on to another build is left
  # alone, so this never moves a channel backwards. A target that did not build is reported.
  attach-experimental:
    name: Add the experimental builds
    needs: [identity, platforms, build-experimental, publish-update]
    if: ${{ !cancelled() && needs.publish-update.result == 'success' && needs.platforms.outputs.experimental != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write
    env:
      BUILD: ${{ needs.identity.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: experimental-*
          path: late
          merge-multiple: true
      - name: Find the archives that built
        id: late
        env:
          EXPECTED: ${{ needs.platforms.outputs.experimental }}
        run: |
          built=0
          for target in $(jq -r '.[].target' <<<"$EXPECTED"); do
            if compgen -G "late/canopy-build-$BUILD-$target.*" > /dev/null; then
              built=$((built + 1))
            else
              echo "::warning::The experimental $target build did not finish: build $BUILD ships without it."
            fi
          done
          echo "built=$built" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.late.outputs.built != '0'
        with:
          pattern: canopy-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.late.outputs.built != '0'
        with:
          name: release-notes
          path: notes
      - name: Add them to the GitHub release
        if: steps.late.outputs.built != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp late/* packaging/install.sh packaging/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          gh release upload "$TAG" late/* dist/SHA256SUMS --clobber --repo "$GITHUB_REPOSITORY"
      - name: Add them to the update feed
        if: steps.late.outputs.built != '0'
        env:
          APP_UPDATES_TOKEN: ${{ secrets.APP_UPDATES_TOKEN }}
        run: |
          if [[ -z $APP_UPDATES_TOKEN ]]; then
            echo "::warning::APP_UPDATES_TOKEN is not set: the update feed does not offer the experimental builds."
            exit 0
          fi
          feed_tag="canopy-build-$BUILD"
          GH_TOKEN=$APP_UPDATES_TOKEN gh release upload "$feed_tag" late/* dist/SHA256SUMS --clobber --repo NecturaLabs/app-updates
          work="$RUNNER_TEMP/app-updates"
          rm -rf "$work"
          # The token travels as in publish-update: in a header set through the environment.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_UPDATES_TOKEN" | base64 -w0)"
          echo "::add-mask::${auth#AUTHORIZATION: basic }"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader GIT_CONFIG_VALUE_0="$auth"
          git clone --depth 1 https://github.com/NecturaLabs/app-updates.git "$work"
          built() {
            python3 -c 'import json,re,sys; v = str(json.load(open(sys.argv[1])).get("version", "")); print(v if re.fullmatch(r"[0-9]+", v) else 0)' "$1"
          }
          channels=""
          for channel in latest beta; do
            manifest="$work/canopy/$channel.json"
            [[ -f $manifest && $(built "$manifest") == "$BUILD" ]] || continue
            tools/update-manifest.sh dist "$BUILD" \
              "https://github.com/NecturaLabs/app-updates/releases/tag/$feed_tag" \
              "https://github.com/NecturaLabs/app-updates/releases/download/$feed_tag" \
              notes/notes.md \
              > "$manifest"
            git -C "$work" add "canopy/$channel.json"
            channels+=" $channel"
          done
          if git -C "$work" diff --cached --quiet; then
            echo "No manifest offers build $BUILD; the feed release has the archives."
            exit 0
          fi
          git -C "$work" config user.name "github-actions[bot]"
          git -C "$work" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$work" commit -m "canopy: add the experimental builds to build $BUILD (${channels# })"
          git -C "$work" push origin main
      - name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/app-updates"
