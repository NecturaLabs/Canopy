name: Advisories

# CI checks advisories only when code changes. An advisory published against an unchanged
# Cargo.lock, or one of deny.toml's ignores becoming stale, shows up here within a week.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  advisories:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      # Nothing is built, but cargo deny runs `cargo metadata`, which resolves rust-toolchain.toml
      # through rustup. Install the pin here, verified and logged, rather than letting rustup
      # fetch it implicitly.
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      - name: cargo deny check advisories
        run: cargo deny check advisories
