name: Feature request
description: Propose a new capability or expand an existing one.
labels:
- enhancement
- needs-triage
- priority:p2-normal
- size:needs-estimate
body:
- type: markdown
  attributes:
    value: Keep the title specific. Search for duplicates and link related issues. Redact credentials
      and private data.
- type: checkboxes
  id: search
  attributes:
    label: Existing issues
    options:
    - label: I searched existing issues.
      required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: A maintainer applies the matching label during triage.
    options:
    - Git operations
    - Interface and themes
    - Accessibility
    - GitHub and GitLab
    - Settings
    - Platform and installers
    - Security and privacy
    - Performance
    - Tests and quality checks
    - Documentation
    - Builds and releases
    - Planning and project workflow
    - Legal
    - Application lifecycle
    - Not sure
  validations:
    required: true
- type: textarea
  id: problem
  attributes:
    label: Problem or use case
    description: What are you trying to do, and what is difficult today?
  validations:
    required: true
- type: textarea
  id: proposal
  attributes:
    label: Proposed behaviour
    description: Describe the requested behaviour and where it belongs in Canopy. A proposal is not
      an approved design.
  validations:
    required: true
- type: textarea
  id: constraints
  attributes:
    label: Constraints and alternatives
    description: Relevant Git behaviour, platforms, safety, privacy or alternatives. Link related
      work or prior art.
  validations:
    required: false
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: List observable outcomes that make this issue complete.
    placeholder: '- [ ] First checkable outcome

      - [ ] Second checkable outcome'
  validations:
    required: true
- type: textarea
  id: where_to_see
  attributes:
    label: Where to see it (optional)
    description: Name the current screen, workflow or fixture and how a reviewer can verify the
      proposal, with exact commands when useful.
  validations:
    required: false
