name: Verification task
description: Verify implemented behaviour and record actual results.
labels:
- verification
- needs-triage
- needs-verification
- priority:p2-normal
- size:needs-estimate
body:
- type: markdown
  attributes:
    value: Keep the title specific. Search for duplicates and link related issues. Redact credentials
      and private data.
- type: checkboxes
  id: search
  attributes:
    label: Existing issues
    options:
    - label: I searched existing issues.
      required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: A maintainer applies the matching label during triage.
    options:
    - Git operations
    - Interface and themes
    - Accessibility
    - GitHub and GitLab
    - Settings
    - Platform and installers
    - Security and privacy
    - Performance
    - Tests and quality checks
    - Documentation
    - Builds and releases
    - Planning and project workflow
    - Legal
    - Application lifecycle
    - Not sure
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: Behaviour to verify
    description: Name the implemented behaviour and link its issue, PR or commit.
  validations:
    required: true
- type: textarea
  id: procedure
  attributes:
    label: Procedure and environment
    description: Describe fixtures, platforms and steps needed. State any credentials, hardware or
      owner involvement without supplying secrets.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: Describe expected observable results. Leave checks open until evidence exists.
    placeholder: '- [ ] First checkable outcome

      - [ ] Second checkable outcome'
  validations:
    required: true
- type: textarea
  id: results
  attributes:
    label: Results so far
    description: Record only checks actually run, including exact build/commit, environment, results
      and remaining gaps. Leave empty if not run.
  validations:
    required: false
