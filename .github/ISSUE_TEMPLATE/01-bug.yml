name: Bug report
description: Report incorrect behaviour or a failure.
labels:
- bug
- needs-triage
- priority:p2-normal
- size:needs-estimate
body:
- type: markdown
  attributes:
    value: Keep the title specific. Search for duplicates and link related issues. Redact credentials
      and private data.
- type: checkboxes
  id: search
  attributes:
    label: Existing issues
    options:
    - label: I searched existing issues.
      required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: A maintainer applies the matching label during triage.
    options:
    - Git operations
    - Interface and themes
    - Accessibility
    - GitHub and GitLab
    - Settings
    - Platform and installers
    - Security and privacy
    - Performance
    - Tests and quality checks
    - Documentation
    - Builds and releases
    - Planning and project workflow
    - Legal
    - Application lifecycle
    - Not sure
  validations:
    required: true
- type: textarea
  id: observed
  attributes:
    label: Observed behaviour
    description: What happens, including the exact error when available.
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behaviour and acceptance criteria
    description: State what should happen as checkable outcomes.
    placeholder: '- [ ] First checkable outcome

      - [ ] Second checkable outcome'
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    description: Give numbered steps and a safe fixture where possible. For intermittent failures,
      describe frequency and what you tried.
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: Include Canopy build/commit, OS/version and git --version. For visual issues include
      theme, window size, display scaling and Wayland/X11 where relevant. Say unknown for unavailable
      details.
  validations:
    required: true
- type: textarea
  id: evidence
  attributes:
    label: Logs, screenshots and related work
    description: Attach relevant redacted evidence and links. Use CANOPY_LOG=canopy=debug when useful.
  validations:
    required: false
