name: Maintenance task
description: Track refactoring, tooling, reliability or project-process work.
labels:
- maintenance
- needs-triage
- priority:p2-normal
- size:needs-estimate
body:
- type: markdown
  attributes:
    value: Keep the title specific. Search for duplicates and link related issues. Redact credentials
      and private data.
- type: checkboxes
  id: search
  attributes:
    label: Existing issues
    options:
    - label: I searched existing issues.
      required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: A maintainer applies the matching label during triage.
    options:
    - Git operations
    - Interface and themes
    - Accessibility
    - GitHub and GitLab
    - Settings
    - Platform and installers
    - Security and privacy
    - Performance
    - Tests and quality checks
    - Documentation
    - Builds and releases
    - Planning and project workflow
    - Legal
    - Application lifecycle
    - Not sure
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: Scope and current problem
    description: Name the affected code, tool or process and explain what needs to change.
  validations:
    required: true
- type: textarea
  id: deliverable
  attributes:
    label: Expected result
    description: Describe the concrete deliverable and its boundaries.
  validations:
    required: true
- type: textarea
  id: constraints
  attributes:
    label: Constraints and related work
    description: Link relevant files, issues or requirements. Record dependencies and decisions that
      remain open.
  validations:
    required: false
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: List observable outcomes that make this issue complete.
    placeholder: '- [ ] First checkable outcome

      - [ ] Second checkable outcome'
  validations:
    required: true
