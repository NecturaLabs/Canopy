name: Owner action
description: Request an owner decision or an external-account task.
labels:
- owner-action
- needs-triage
- priority:p2-normal
- size:needs-estimate
body:
- type: markdown
  attributes:
    value: Keep the title specific. Search for duplicates and link related issues. Redact credentials
      and private data.
- type: checkboxes
  id: search
  attributes:
    label: Existing issues
    options:
    - label: I searched existing issues.
      required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    description: A maintainer applies the matching label during triage.
    options:
    - Git operations
    - Interface and themes
    - Accessibility
    - GitHub and GitLab
    - Settings
    - Platform and installers
    - Security and privacy
    - Performance
    - Tests and quality checks
    - Documentation
    - Builds and releases
    - Planning and project workflow
    - Legal
    - Application lifecycle
    - Not sure
  validations:
    required: true
- type: textarea
  id: action
  attributes:
    label: Decision or external task
    description: State the specific decision, legal information or account action needed from the
      owner.
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Context and blocked work
    description: Explain why it is needed and link the work it blocks.
  validations:
    required: true
- type: textarea
  id: options
  attributes:
    label: Options and trade-offs
    description: Give concrete options and consequences when known. Do not imply approval.
  validations:
    required: false
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
    description: State which recorded decision or verified external setting completes this request.
    placeholder: '- [ ] First checkable outcome

      - [ ] Second checkable outcome'
  validations:
    required: true
