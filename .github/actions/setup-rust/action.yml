name: Setup Rust
description: >-
  Installs the Rust toolchain and, when asked, restores the build cache. On the
  organisation's self-hosted runners, which share one home directory, each runner
  keeps its own rustup and cargo homes in its tool cache, so jobs on different
  runners never install or update a toolchain under each other. On Windows it
  also puts Git Bash ahead of the System32 WSL launcher, so `shell: bash` steps
  get the same bash as on GitHub-hosted runners.

inputs:
  components:
    description: Comma-separated rustup components, e.g. clippy
    required: false
    default: ""
  targets:
    description: Comma-separated compilation targets
    required: false
    default: ""
  cache:
    description: Restore and save the build cache with Swatinem/rust-cache
    required: false
    default: "true"
  cache-key:
    description: Extra key for the build cache
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Container jobs run as root in a fresh home; a root-owned toolchain in the
    # host's tool cache would lock the runner's own user out of it.
    - name: Use this runner's Rust homes
      if: runner.environment == 'self-hosted' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        [[ -f /.dockerenv ]] && exit 0
        root="$RUNNER_TOOL_CACHE/rust"
        echo "CARGO_HOME=$root/cargo" >> "$GITHUB_ENV"
        echo "RUSTUP_HOME=$root/rustup" >> "$GITHUB_ENV"
        echo "$root/cargo/bin" >> "$GITHUB_PATH"

    # The machine-wide rustup in the service account's profile is already on
    # PATH, so this runner's own one is installed here rather than left to
    # dtolnay/rust-toolchain, which would find the shared one and skip it.
    - name: Use this runner's Rust homes and Git Bash
      if: runner.environment == 'self-hosted' && runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $root = Join-Path $env:RUNNER_TOOL_CACHE 'rust'
        $env:CARGO_HOME = Join-Path $root 'cargo'
        $env:RUSTUP_HOME = Join-Path $root 'rustup'
        $bin = Join-Path $env:CARGO_HOME 'bin'
        if (-not (Test-Path (Join-Path $bin 'rustup.exe'))) {
          $init = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
          Invoke-WebRequest -Uri 'https://win.rustup.rs/x86_64' -OutFile $init
          & $init --default-toolchain none --no-modify-path -y
          if ($LASTEXITCODE -ne 0) { throw "rustup-init exited with $LASTEXITCODE" }
        }
        "CARGO_HOME=$env:CARGO_HOME" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        "RUSTUP_HOME=$env:RUSTUP_HOME" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
        # Each line is prepended, so the last one comes first.
        'C:\Program Files\Git\bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
        $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

    - uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - uses: Swatinem/rust-cache@v2
      if: inputs.cache == 'true'
      with:
        key: ${{ inputs.cache-key }}
