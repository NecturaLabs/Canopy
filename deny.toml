# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run locally with `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[advisories]
version = 2
yanked = "warn"
ignore = [
  # bincode 1 is unmaintained, not vulnerable. syntect uses it only to load the syntax
  # definitions compiled into Canopy (trusted, bundled data), never untrusted input.
  { id = "RUSTSEC-2025-0141", reason = "syntect loads only bundled syntax dumps with bincode" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "OFL-1.1",
  "CC0-1.0",
  "BSL-1.0",
]

# egui's default fonts bundle the Ubuntu font family.
[[licenses.exceptions]]
crate = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

# Mozilla's CA bundle, packaged as data under CDLA-Permissive-2.0: rustls's fallback roots for
# canopy-hosting's HTTPS client (ureq, rustls-platform-verifier).
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]

# Workspace crates are unpublished (`publish = false`); their own licence is MIT OR Apache-2.0.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies (canopy-core) are not wildcards in the crates.io sense.
allow-wildcard-paths = true
highlight = "all"
deny = [
  # Network transports belong to the git CLI; libgit2 must stay free of OpenSSL and libssh2.
  { crate = "openssl-sys", reason = "network operations use the git CLI" },
  { crate = "libssh2-sys", reason = "network operations use the git CLI" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
